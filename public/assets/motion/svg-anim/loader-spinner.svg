<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50" class="anim-spin" aria-label="Loading">
  <style>
    .anim-spin { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .anim-spin { animation: none; } }
  </style>
  <circle cx="25" cy="25" r="20" fill="none" stroke="var(--color-surface-raised, #e2e8f0)" stroke-width="5" />
  <circle cx="25" cy="25" r="20" fill="none" stroke="var(--color-brand-500, #3b82f6)" stroke-width="5" stroke-dasharray="125" stroke-dashoffset="90" stroke-linecap="round" />
</svg>
