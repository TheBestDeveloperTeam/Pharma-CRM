<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pharma CRM | Log in</title>

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- Theme style (AdminLTE v3) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  
  <style>
    .login-box { margin-top: 10vh; }
    #error-alert { display: none; }
  </style>
</head>
<body class="hold-transition login-page">
<div class="login-box">
  <div class="login-logo">
    <a href="#"><b>Pharma</b>CRM</a>
  </div>
  <!-- /.login-logo -->
  <div class="card">
    <div class="card-body login-card-body">
      <p class="login-box-msg">Sign in to start your session</p>

      <div id="error-alert" class="alert alert-danger text-sm"></div>

      <form id="login-form">
        <div class="input-group mb-3">
          <input type="email" id="email" class="form-control" placeholder="Email" required value="admin@pharmacrm.local">
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-envelope"></span>
            </div>
          </div>
        </div>
        <div class="input-group mb-3">
          <input type="password" id="password" class="form-control" placeholder="Password" required value="Admin@1234">
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-lock"></span>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-8">
            <!-- Remember Me omitted for simplicity -->
          </div>
          <!-- /.col -->
          <div class="col-4">
            <button type="submit" id="btn-login" class="btn btn-primary btn-block">Sign In</button>
          </div>
          <!-- /.col -->
        </div>
      </form>
    </div>
    <!-- /.login-card-body -->
  </div>
</div>
<!-- /.login-box -->

<!-- jQuery -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<!-- Bootstrap 4 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- AdminLTE App -->
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>

<script src="/assets/js/api.js"></script>
<script>
  $(document).ready(function() {
      // If already logged in, go to dashboard
      if (apiClient.getToken()) {
          window.location.href = '/dashboard.html';
      }

      $('#login-form').on('submit', async function(e) {
          e.preventDefault();
          
          const email = $('#email').val();
          const password = $('#password').val();
          const $btn = $('#btn-login');
          const $error = $('#error-alert');
          
          $btn.prop('disabled', true).text('Signing in...');
          $error.hide();
          
          try {
              const res = await apiClient.login(email, password);
              if (res.success) {
                  window.location.href = '/dashboard.html';
              }
          } catch (err) {
              $error.text(err.error?.message || 'Login failed. Please check your credentials.').show();
          } finally {
              $btn.prop('disabled', false).text('Sign In');
          }
      });
  });
</script>
</body>
</html>
