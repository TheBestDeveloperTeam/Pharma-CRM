<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pharma CRM | Customers</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
  <!-- Navbar -->
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav">
      <li class="nav-item"><a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a></li>
    </ul>
    <ul class="navbar-nav ml-auto">
      <li class="nav-item"><a class="nav-link" href="#" id="btn-logout" role="button"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
    </ul>
  </nav>

  <!-- Main Sidebar Container -->
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="/dashboard.html" class="brand-link"><span class="brand-text font-weight-light ml-3"><b>Pharma</b>CRM</span></a>
    <div class="sidebar">
      <div class="user-panel mt-3 pb-3 mb-3 d-flex"><div class="info"><a href="#" class="d-block" id="sidebar-user-name">User</a></div></div>
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
          <li class="nav-item"><a href="/dashboard.html" class="nav-link"><i class="nav-icon fas fa-tachometer-alt"></i><p>Dashboard</p></a></li>
          <li class="nav-header">MASTERS</li>
          <li class="nav-item"><a href="/territories.html" class="nav-link"><i class="nav-icon fas fa-map-marker-alt"></i><p>Territories</p></a></li>
          <li class="nav-item"><a href="/products.html" class="nav-link"><i class="nav-icon fas fa-pills"></i><p>Products</p></a></li>
          <li class="nav-item"><a href="/customers.html" class="nav-link active"><i class="nav-icon fas fa-user-md"></i><p>Customers</p></a></li>
          <li class="nav-header">OPERATIONS</li>
          <li class="nav-item"><a href="/dcrs.html" class="nav-link"><i class="nav-icon fas fa-calendar-check"></i><p>DCRs</p></a></li>
          <li class="nav-item"><a href="/orders.html" class="nav-link"><i class="nav-icon fas fa-shopping-cart"></i><p>Orders</p></a></li>
          <li class="nav-item"><a href="/inventory.html" class="nav-link"><i class="nav-icon fas fa-boxes"></i><p>Inventory</p></a></li>
        </ul>
      </nav>
    </div>
  </aside>

  <div class="content-wrapper">
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6"><h1 class="m-0">Customers</h1></div>
          <div class="col-sm-6 text-right"><button class="btn btn-primary" data-toggle="modal" data-target="#modal-customer">Add Customer</button></div>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="container-fluid">
        <div class="card">
          <div class="card-body p-0">
            <table class="table table-striped" id="data-table">
              <thead><tr><th>ID</th><th>Name</th><th>Type</th><th>Territory</th><th>Specialty</th><th>Status</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modal-customer">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="form-data">
          <div class="modal-header"><h4 class="modal-title">Add Customer</h4><button type="button" class="close" data-dismiss="modal">&times;</button></div>
          <div class="modal-body">
            <div id="modal-error" class="alert alert-danger" style="display:none;"></div>
            <div class="form-group"><label>Name</label><input type="text" id="f-name" class="form-control" required></div>
            <div class="form-group">
              <label>Type</label>
              <select id="f-type" class="form-control">
                <option value="doctor">Doctor</option>
                <option value="chemist">Chemist</option>
                <option value="stockist">Stockist</option>
              </select>
            </div>
            <div class="form-group">
              <label>Territory</label>
              <select id="f-territory" class="form-control" required></select>
            </div>
            <div class="form-group"><label>Specialty</label><input type="text" id="f-specialty" class="form-control"></div>
            <div class="form-group"><label>Email</label><input type="email" id="f-email" class="form-control"></div>
            <div class="form-group"><label>Phone</label><input type="text" id="f-phone" class="form-control"></div>
          </div>
          <div class="modal-footer justify-content-between">
            <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-primary" id="btn-save">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <footer class="main-footer"><strong>Copyright &copy; 2026 Pharma CRM.</strong></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
<script src="/assets/js/api.js"></script>
<script>
  $(document).ready(async function() {
      if (!apiClient.checkAuth()) return;
      const user = apiClient.getUser();
      if (user) $('#sidebar-user-name').text(user.name || user.email);
      $('#btn-logout').click((e) => { e.preventDefault(); apiClient.logout(); });

      async function loadTerritories() {
          try {
              const res = await apiClient.request('/territories');
              const data = res.data || [];
              const select = $('#f-territory');
              select.empty();
              data.forEach(t => select.append(`<option value="${t.id}">${t.name}</option>`));
          } catch(e) { console.error('Failed to load territories'); }
      }

      async function loadData() {
          const tbody = $('#data-table tbody');
          tbody.html('<tr><td colspan="6" class="text-center">Loading...</td></tr>');
          try {
              const res = await apiClient.request('/customers');
              const data = res.data || [];
              tbody.empty();
              if (data.length === 0) { tbody.html('<tr><td colspan="6" class="text-center">No customers found</td></tr>'); return; }
              data.forEach(item => {
                  tbody.append(`<tr><td>${item.id}</td><td>${item.name}</td><td><span class="badge badge-info">${item.type}</span></td><td>${item.territory_name || '-'}</td><td>${item.specialty || '-'}</td><td>${item.status === 'active' ? '<span class="badge badge-success">Active</span>' : '<span class="badge badge-danger">Inactive</span>'}</td></tr>`);
              });
          } catch (err) { tbody.html('<tr><td colspan="6" class="text-center text-danger">Failed to load data</td></tr>'); }
      }

      $('#form-data').submit(async function(e) {
          e.preventDefault();
          const $btn = $('#btn-save'); const $err = $('#modal-error');
          $btn.prop('disabled', true); $err.hide();
          try {
              await apiClient.request('/customers', { method: 'POST', body: { name: $('#f-name').val(), type: $('#f-type').val(), territory_id: $('#f-territory').val(), specialty: $('#f-specialty').val(), email: $('#f-email').val(), phone: $('#f-phone').val() } });
              $('#modal-customer').modal('hide'); $('#form-data')[0].reset(); loadData();
          } catch (err) { $err.text(err.error?.message || 'Failed to create').show(); }
          finally { $btn.prop('disabled', false); }
      });
      loadTerritories();
      loadData();
  });
</script>
</body>
</html>
