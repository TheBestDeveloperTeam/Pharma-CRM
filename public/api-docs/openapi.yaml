    post:
      summary: Public distributor registration submission
      tags: [Admin Parties & Onboarding]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - firm_name
                - constitution_type
                - contact_name
                - designation
                - mobile
                - email
                - gstin
                - pan
                - drug_license_no
                - drug_license_validity
                - billing_address
                - shipping_address
                - pincode
                - preferred_product_categories
                - password
                - documents
              properties:
                token: {type: string}
                firm_name: {type: string}
                constitution_type:
                  type: string
                  enum: [Proprietorship, Partnership, Pvt Ltd, LLP]
                contact_name: {type: string}
                designation: {type: string}
                mobile: {type: string}
                email: {type: string, format: email}
                gstin: {type: string}
                pan: {type: string}
                drug_license_no: {type: string}
                drug_license_validity: {type: string, format: date}
                billing_address: {type: string}
                shipping_address: {type: string}
                state_ref: {type: string}
                district_ref: {type: string}
                city_ref: {type: string}
                area: {type: string}
                pincode: {type: string}
                bank_account_number: {type: string}
                bank_ifsc: {type: string}
                bank_name: {type: string}
                preferred_product_categories:
                  type: array
                  items: {type: string}
                expected_monthly_business: {type: number}
                password: {type: string}
                documents:
                  type: array
                  items:
                    type: object
                    required: [type, file_reference, file_name]
                    properties:
                      type:
                        type: string
                        enum:
                          - Drug Licence
                          - GST Certificate
                          - PAN
                          - Cancelled Cheque
                          - Partnership Deed / Incorporation Certificate
                      file_reference: {type: string}
                      file_name: {type: string}
      responses:
        '201':
          description: Registration submitted successfully.
        '404':
          description: Invalid invite token
        '409':
          description: Invite already used or duplicate party identifiers
        '422':
          description: Validation error or expired token

