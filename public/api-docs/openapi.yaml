    parameters:
    - {name: ref, in: path, required: true, schema: {type: string}}
    get:
      summary: Get order detail, items and lifecycle history
      tags: [Admin Orders]
      responses: {'200': {description: Order detail.}}
    patch:
      summary: Update draft order
      tags: [Admin Orders]
      responses: {'200': {description: Draft updated.}}
    delete:
      summary: Delete draft order
      tags: [Admin Orders]
      responses: {'200': {description: Draft deleted.}}

  /admin/orders/{ref}/submit:
    post:
      summary: Submit draft order
      tags: [Admin Orders]
      parameters:
      - {name: ref, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: Order submitted.}}

  /admin/orders/{ref}/confirm:
    post:
      summary: Confirm submitted order and reserve stock using FEFO
      tags: [Admin Orders]
      parameters:
      - {name: ref, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: Order confirmed and reservations 
            returned.}, '422': {description: CREDIT_LIMIT_EXCEEDED when 
            projected exposure is greater than the stored credit limit; equality
            is allowed.}}

  /admin/orders/{ref}/cancel:
    post:
      summary: Cancel order and release owned reservations
      tags: [Admin Orders]
      parameters:
      - {name: ref, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: Order cancelled.}}

  /admin/inventory/batches:
    get:
      summary: List inventory batches and available stock
      tags: [Admin Inventory]
      responses: {'200': {description: Paginated batch list.}}

  /admin/inventory/batches/{ref}:
    get:
      summary: Get batch and movement history
      tags: [Admin Inventory]
      parameters:
      - {name: ref, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: Batch detail.}}

  /admin/inventory/receive:
    post:
      summary: Receive a stock batch
      tags: [Admin Inventory]
      responses: {'201': {description: Batch received.}}

  /admin/inventory/batches/{ref}/adjust:
    post:
      summary: Adjust batch stock with reason
      tags: [Admin Inventory]
      parameters:
      - {name: ref, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: Batch adjusted.}}

  /admin/inventory/reservations/{order_ref}:
    get:
      summary: List order stock reservations
      tags: [Admin Inventory]
      parameters:
      - {name: order_ref, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: Reservation history.}}

  /admin/inventory/reservations/{order_ref}/release:
    post:
      summary: Release active order reservations
      tags: [Admin Inventory]
      parameters:
      - {name: order_ref, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: Reservations released.}}

  /admin/inventory/reservations/{order_ref}/consume:
    post:
      summary: Consume active order reservations (future dispatch/billing 
        foundation)
      tags: [Admin Inventory]
      parameters:
      - {name: order_ref, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: Reservations consumed and stock movements
            recorded.}}

  /admin/inventory/near-expiry:
    get:
      summary: List near-expiry batches
      tags: [Admin Inventory]
      parameters:
      - name: days
        in: query
        schema: {type: integer, default: 180}
      responses:
        '200':
          description: Near-expiry batches list.

  /admin/inventory/movements:
    get:
      summary: Movement ledger — all stock movements across batches
      tags: [Admin Inventory]
      parameters:
      - name: batch_ref
        in: query
        schema: {type: string}
      - name: product_ref
        in: query
        schema: {type: string}
      - name: movement_type
        in: query
        schema: {type: string}
      - name: from_date
        in: query
        schema: {type: string, format: date}
      - name: to_date
        in: query
        schema: {type: string, format: date}
      - name: page
        in: query
        schema: {type: integer, default: 1}
      - name: per_page
        in: query
        schema: {type: integer, default: 50}
      responses:
        '200':
          description: Paginated movement ledger.

  /admin/inventory/batches/{ref}/edit:
    post:
      summary: Edit batch metadata (location, expiry, batch_no)
      tags: [Admin Inventory]
      parameters:
      - name: ref
        in: path
        required: true
        schema: {type: string}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                batch_no: {type: string}
                expiry_date: {type: string, format: date}
                manufacturing_date: {type: string, format: date}
                location_code: {type: string}
      responses:
        '200':
          description: Batch metadata updated.
        '404':
          description: Batch not found.

  /admin/inventory/transfer:
    post:
      summary: Stock transfer between warehouses/locations within same franchise
      tags: [Admin Inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batch_ref, qty, from_location, to_location]
              properties:
                batch_ref: {type: string}
                qty: {type: integer, minimum: 1}
                from_location: {type: string}
                to_location: {type: string}
                reason: {type: string}
      responses:
        '200':
          description: Stock transferred successfully.
        '400':
          description: Insufficient stock.
        '404':
          description: Batch not found.

  /admin/invoices:
    get:
      summary: List tax invoices
      tags: [Admin Billing & Invoices]
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PerPageParam'
      - name: party_ref
        in: query
        schema: {type: string}
      - name: status
        in: query
        schema: {type: string, enum: [POSTED, CANCELLED]}
      responses:
        '200':
          description: Invoices list.

  /admin/invoices/{ref}:
    get:
      summary: Get invoice details and line items
      tags: [Admin Billing & Invoices]
      parameters:
      - name: ref
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Invoice details.
  /admin/invoices/by-order/{order_ref}:
    get:
      summary: Get the invoice generated for an order
      tags: [Admin Billing & Invoices]
      parameters:
      - {name: order_ref, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: Invoice detail.}}

  /admin/invoices/generate:
    post:
      summary: Generate gapless tax invoice from confirmed order
      description: Resolves supplier and normalized delivery states, calculates 
        GST from authoritative product rates, and creates an immutable tax 
        invoice. Missing supplier or delivery state fails before invoice 
        persistence.
      tags: [Admin Billing & Invoices]
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_ref]
              properties:
                order_ref: {type: string}
                due_date: {type: string, format: date}
      responses:
        '201':
          description: Tax invoice generated.

  /admin/invoices/{ref}/cancel:
    post:
      summary: Cancel an unpaid, undispatched posted invoice
      tags: [Admin Billing & Invoices]
      parameters:
      - {name: ref, in: path, required: true, schema: {type: string}}
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: {reason: {type: string, minLength: 2}}
      responses: {'200': {description: Invoice cancelled.}}

  /admin/pdc:
    get:
      summary: List tenant-scoped post-dated cheques
      tags: [Admin Payments]
      security: [bearerAuth: []]
      parameters: [{name: page, in: query, schema: {type: integer, minimum: 1}}, {
          name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 
              100}}, {name: party_ref, in: query, schema: {type: string}}]
      responses: {'200': {description: Paginated PDC DTOs, content: {
              application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Pdc'}}}}},
        '403': {description: Missing payments view permission.}}
    post:
      summary: Register a pending post-dated cheque without financial effect
      tags: [Admin Payments]
      security: [bearerAuth: []]
      requestBody: {required: true, content: {application/json: {schema: {type: 
                object, required: [party_ref, amount, cheque_number], properties: {
                party_ref: {type: string}, amount: {type: number}, cheque_number: {
                  type: string}, bank_name: {type: string}, due_date: {type: 
                    string, format: date}}}}}}
      responses: {'201': {description: Pending PDC registered.}, '422': {
            description: Invalid PDC or inaccessible party.}}
  /admin/pdc/{ref}:
    get:
      summary: Get a tenant- and scope-protected PDC
      tags: [Admin Payments]
      security: [bearerAuth: []]
      parameters: [{name: ref, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: PDC detail., content: {application/json: {
              schema: {$ref: '#/components/schemas/Pdc'}}}}, '404': {description: 
            Not found or inaccessible.}}
  /admin/pdc/{ref}/realize:
    post:
      summary: Realize a pending PDC into one normal manual-allocation Payment
      tags: [Admin Payments]
      security: [bearerAuth: []]
      parameters: [{name: ref, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: PDC realized and payment linked.}, '422': {
          description: Invalid transition or duplicate realization.}}
  /admin/pdc/{ref}/bounce:
    post:
      summary: Bounce a pending PDC without financial effect
      tags: [Admin Payments]
      security: [bearerAuth: []]
      parameters: [{name: ref, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: 
                object, required: [reason], properties: {reason: {type: string, 
                    minLength: 2}}}}}}
      responses: {'200': {description: PDC bounced.}, '422': {description: 
            Invalid transition.}}
  /admin/pdc/{ref}/cancel:
    post:
      summary: Cancel a pending PDC without financial effect
      tags: [Admin Payments]
      security: [bearerAuth: []]
      parameters: [{name: ref, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: 
                object, required: [reason], properties: {reason: {type: string, 
                    minLength: 2}}}}}}
      responses: {'200': {description: PDC cancelled.}, '422': {description: 
            Invalid transition.}}

  /admin/outstanding:
    get:
      summary: List scope-protected invoice outstanding and ageing rows
      description: Uses invoice due_date as the only due-date authority. 
        Pending, bounced, and cancelled PDCs have no effect; only active 
        allocations on non-reversed payments reduce a balance.
      tags: [Admin Payments]
      security: [bearerAuth: []]
      parameters:
      - {name: party_ref, in: query, schema: {type: string}}
      - {name: bucket, in: query, schema: {type: string, enum: [NOT_DUE, 0-30, 
              31-60, 61-90, 91-120, 120+, UNCLASSIFIED]}}
      - {name: from, in: query, schema: {type: string, format: date}}
      - {name: to, in: query, schema: {type: string, format: date}}
      - {name: page, in: query, schema: {type: integer, minimum: 1}}
      - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 
            100}}
      - {name: sort_by, in: query, schema: {type: string, enum: [invoiceNumber, 
              partyName, dueDate, balance, bucket, daysOverdue, status]}}
      - {name: sort_dir, in: query, schema: {type: string, enum: [asc, desc]}}
      responses: {'200': {description: Scoped, paginated open-invoice rows.: 
            null, content: {application/json: {schema: {type: array, items: {
                    $ref: '#/components/schemas/OutstandingInvoice'}}}}}, '403': {
          description: Missing payments view permission.}}

  # ============================================================================
  # Franchise Admin: Dispatches & Payments
  # ============================================================================
  /admin/dispatches:
    get:
      summary: List dispatches
      tags: [Admin Dispatches]
      responses:
        '200':
          description: Dispatches list.
    post:
      summary: Create dispatch consignment
      description: Requires a POSTED invoice with a resolved GST policy; 
        otherwise returns `GST_DEPENDENCY_BLOCKED`. Partial dispatch and 
        client-selected line quantities are not supported by the approved 
        frontend flow.
      tags: [Admin Dispatches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoice_ref, transporter_ref, lr_number]
              properties:
                invoice_ref: {type: string}
                transporter_ref: {type: string}
                lr_number: {type: string, example: "LR-998877"}
                vehicle_no: {type: string}
                tracking_url: {type: string}
                boxes: {type: integer, minimum: 1}
                remarks: {type: string}
      responses:
        '201':
          description: Dispatch recorded.

  /admin/dispatches/{ref}/deliver:
    post:
      summary: Mark dispatch as delivered
      tags: [Admin Dispatches]
      parameters:
      - name: ref
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Dispatch delivered.

  /admin/dispatches/{ref}:
    get:
      summary: Get dispatch detail, delivery metadata, and lifecycle history
      tags: [Admin Dispatches]
      parameters:
      - {name: ref, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: Dispatch detail.}}

  /admin/payments:
    get:
      summary: List payments
      tags: [Admin Payments]
      responses:
        '200':
          description: Payments list.
    post:
      summary: Record payment collection and allocate to invoices
      tags: [Admin Payments]
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [party_ref, amount, payment_mode]
              properties:
                party_ref: {type: string}
                amount: {type: number, format: float, example: 20000.00}
                payment_mode: {type: string, enum: [NEFT, RTGS, CHEQUE, CASH, 
                      UPI]}
                reference_no: {type: string}
                allocations:
                  type: array
                  items:
                    type: object
                    required: [invoice_ref, allocated_amount]
                    properties:
                      invoice_ref: {type: string}
                      allocated_amount: {type: number, format: float}
      responses:
        '201':
          description: Payment recorded and allocated.

  /admin/payments/{ref}:
    parameters:
    - {name: ref, in: path, required: true, schema: {type: string}}
    get:
      summary: Get payment details with allocations
      tags: [Admin Payments]
      responses:
        '200':
          description: Payment details.
        '404':
          description: Payment not found.

  /admin/payments/{ref}/allocations:
    post:
      summary: Manually allocate a payment to one invoice
      description: Supports partial and multi-invoice allocation through 
        explicit requests. Automatic allocation order is not assumed.
      tags: [Admin Payments]
      parameters:
      - {name: ref, in: path, required: true, schema: {type: string}}
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoice_ref, amount]
              properties:
                invoice_ref: {type: string}
                amount: {type: number, format: float, minimum: 0.01}
      responses:
        '201':
          description: Allocation created.

  /admin/payments/{ref}/reverse:
    post:
      summary: Reverse a payment and its invoice allocations
      tags: [Admin Payments]
      parameters:
      - {name: ref, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, idempotency_key]
              properties:
                reason: {type: string, example: "Cheque bounced"}
                idempotency_key: {type: string}
      responses:
        '201':
          description: Payment reversed.
        '404':
          description: Payment not found.

  # ============================================================================
  # Franchise Admin: 12 Reports
  # ============================================================================
  /admin/reports/{type}:
    get:
      summary: Retrieve report dataset (JSON)
      description: |
        Supported report types:
        - `sales-summary`
        - `orders-register`
        - `invoices-register`
        - `payments-register`
        - `outstanding`
        - `party-ledger`
        - `inventory-status`
        - `near-expiry`
        - `lead-funnel`
        - `scheme-utilization`
        - `audit-log`
        - `tenant-activity`
      tags: [Admin Reports]
      parameters:
      - name: type
        in: path
        required: true
        schema: {type: string}
      - name: party_ref
        in: query
        schema: {type: string}
      - name: days
        in: query
        schema: {type: integer}
      responses:
        '200':
          description: Report data rows.

  /admin/reports/{type}/export:
    get:
      summary: Export report as CSV download
      tags: [Admin Reports]
      parameters:
      - name: type
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Streamed CSV file download.
          content:
            text/csv:
              schema:
                type: string

  # ============================================================================
  # Notifications
  # ============================================================================
  /notifications:
    get:
      summary: List in-app notifications
      tags: [Notifications]
      parameters:
      - name: limit
        in: query
        schema: {type: integer, default: 20}
      responses:
        '200':
          description: Notifications list.

  /notifications/read-all:
    post:
      summary: Mark all notifications as read
      tags: [Notifications]
      responses:
        '200':
          description: Number of notifications marked read.

  /notifications/{ref}/read:
    post:
      summary: Mark specific notification as read
      tags: [Notifications]
      parameters:
      - name: ref
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Notification read confirmed.

  # ============================================================================
  # Distributor Self-Service Portal
  # ============================================================================
  /portal/profile:
    get:
      summary: Get distributor portal profile
      tags: [Distributor Portal]
      responses:
        '200':
          description: Distributor party profile.
    patch:
      summary: Update shipping address or contact info
      tags: [Distributor Portal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shipping_address: {type: string}
                contact_name: {type: string}
                mobile: {type: string}
      responses:
        '200':
          description: Profile updated.

  /portal/catalogue:
    get:
      summary: Browse product catalogue with personalized tier rates
      tags: [Distributor Portal]
      responses:
        '200':
          description: Product catalogue with applicable pricing.

  /portal/cart/calculate:
    post:
      summary: Server-side cart calculation with schemes & tax
      description: Prevents client-side price tampering by computing exact unit 
        rates, free goods schemes, and GST.
      tags: [Distributor Portal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [product_ref, qty]
                    properties:
                      product_ref: {type: string}
                      qty: {type: integer, example: 20}
      responses:
        '200':
          description: Calculated cart item lines, subtotal, discounts, GST, and
            grand total.

  /portal/orders:
    get:
      summary: List distributor's own orders
      tags: [Distributor Portal]
      responses:
        '200':
          description: Orders list.
    post:
      summary: Place distributor order
      tags: [Distributor Portal]
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_order_ref, items]
              properties:
                client_order_ref: {type: string, example: "WEB-ORD-001"}
                shipping_address: {type: string}
                remarks: {type: string}
                items:
                  type: array
                  items:
                    type: object
                    required: [product_ref, paid_qty]
                    properties:
                      product_ref: {type: string}
                      paid_qty: {type: integer, example: 50}
      responses:
        '201':
          description: Order placed.

  /portal/orders/{ref}:
    parameters:
    - name: ref
      in: path
      required: true
      schema: {type: string}
    get:
      summary: Get distributor order details
      tags: [Distributor Portal]
      responses:
        '200':
          description: Order details.
        '404':
          description: Order not found.

  /portal/orders/{ref}/cancel:
    post:
      summary: Cancel distributor order (allowed pre-confirm only)
      tags: [Distributor Portal]
      parameters:
      - name: ref
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Order cancelled.

  /portal/invoices:
    get:
      summary: List invoices issued to distributor
      tags: [Distributor Portal]
      responses:
        '200':
          description: Invoices list.

  /portal/dispatches:
    get:
      summary: Track consignments and LR tracking details
      tags: [Distributor Portal]
      responses:
        '200':
          description: Dispatches list.

  /portal/outstanding:
    get:
      summary: View distributor outstanding balance and ledger
      tags: [Distributor Portal]
      responses:
        '200':
          description: Outstanding balance breakdown.

  /portal/team:
    get:
      summary: List distributor team members (EAs / MRs)
      description: Returns the list of EA field force employees created by this distributor.
      tags: [Distributor Portal]
      security: [bearerAuth: []]
      responses:
        '200':
          description: Team members list.
    post:
      summary: Create EA field force employee
      description: Allows a distributor to hire/create their own field representative. Franchise Code is required upfront.
      tags: [Distributor Portal]
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [franchise_code, full_name, email, mobile]
              properties:
                franchise_code: {type: string, example: "MUMBAI", description: "Franchise code of distributor"}
                full_name: {type: string, example: "Ramesh Kumar (MR)"}
                email: {type: string, example: "ramesh.mr@distributor.local"}
                mobile: {type: string, example: "9820011223"}
                password: {type: string, example: "Password@123"}
                designation: {type: string, example: "Medical Representative"}
      responses:
        '201':
          description: EA team employee created successfully.

  /portal/team/orders:
    get:
      summary: List EA team orders pending distributor review
      description: Lists orders taken by EA field staff that require distributor approval before company fulfillment.
      tags: [Distributor Portal]
      security: [bearerAuth: []]
      responses:
        '200':
          description: Orders submitted by EA field representatives.

  /portal/team/orders/{ref}/approve:
    post:
      summary: Approve EA-originated order
      description: Confirms an EA booked order. Transitions order to CONFIRMED and unlocks company HQ fulfillment.
      tags: [Distributor Portal]
      security: [bearerAuth: []]
      parameters:
        - name: ref
          in: path
          required: true
          schema: {type: string}
          example: "ord_6f4b231a980c"
      responses:
        '200':
          description: Order approved and confirmed.

  # ============================================================================
  # TASK-001 — Roles, Permissions & Scope
  # ============================================================================
  /admin/roles:
    get:
      summary: List normalized roles in the current tenant
      tags: [Admin Users]
      security: [bearerAuth: []]
      responses:
        '200': {description: Roles returned with assigned user counts.}
    post:
      summary: Create a configurable role
      tags: [Admin Users]
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleMutation'
      responses:
        '201': {description: Role created.}
        '403': {description: Missing permission or privilege escalation.}
        '422': {description: Validation failure.}

  /admin/roles/{ref}:
    parameters:
    - name: ref
      in: path
      required: true
      schema: {type: string, example: ROL-01JABCDEF1234567}
    get:
      summary: Get role detail, grants and scope overrides
      tags: [Admin Users]
      security: [bearerAuth: []]
      responses:
        '200': {description: Role detail.}
        '404': {description: Role is outside the caller tenant or does not 
            exist.}
    patch:
      summary: Update a configurable role
      tags: [Admin Users]
      security: [bearerAuth: []]
