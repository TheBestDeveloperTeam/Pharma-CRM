openapi: 3.0.3
info:
  title: Pharma CRM & Sales Force Automation API
  version: 3.0.0
  description: |
    Comprehensive, enterprise-grade RESTful API documentation for Pharma CRM & Sales Force Automation.

    ### Architecture & Golden Rules
    - **Uniform HTTP 200 Response Protocol:** All API endpoints across the entire application return HTTP 200 OK for both successful responses and business/validation error messages. Error conditions are communicated deterministically via the response payload envelope with `{"success": false, "error": {"code": "...", "message": "...", "fields": [...]}}`.
    - **Multi-Tenancy:** Row-level tenancy enforced via `org_ref` and `franchise_ref`.
    - **Authentication:** OAuth 2.0 style Bearer JWT access tokens (15-minute expiry) and rotating refresh tokens with reuse detection.
    - **Idempotency:** Mutating `/api/v1` operations may send `Idempotency-Key` (16-120 ASCII letters, digits, `_` or `-`). Matching requests replay the complete response envelope; a different fingerprint returns `409 IDEMPOTENCY_MISMATCH`.
    - **Deterministic Numbering:** Sequential gapless numbering for Orders, Invoices, Dispatches, and Payments via atomic sequence counters.
    - **Inventory & Pricing:** Strict server-side First-Expiry-First-Out (FEFO) allocation and hierarchical priority pricing (Party > Tier > Default).
    - **Auditability:** Immutable, append-only audit trail on all business and security transactions.

    ### The 9 Complete User Journeys (E2E)
    This specification strictly implements the 9 core workflows across all roles:
    1. **Platform Provisioning (Super Admin):** Organization and franchise setup, auditing.
    2. **Franchise Onboarding (Admin):** Users, catalog, pricing, and territories setup.
    3. **Lead & Prospecting (Sales):** Lead capture, territory management, and follow-ups.
    4. **Inventory & Warehouse (Admin):** Goods receipt (GRN), FEFO batch tracking, and adjustments.
    5. **Portal Catalog (Distributor):** Live catalog browsing and dynamic cart calculation.
    6. **Sales Orders (Sales/Distributor):** Order submission and FEFO stock reservation upon approval.
    7. **Billing & Invoicing (Admin):** Tax invoice generation with snapshot pricing and GST.
    8. **Logistics & Dispatch (Admin):** Transporter assignment and delivery tracking (LR).
    9. **Payments & Ledger (Admin):** Payment recording, invoice allocation, and outstanding sync.
servers:
- url: https://crm.easysolutins24.in/api/v1
  description: Production Cloud Server (cPanel Shared Hosting)
- url: http://crm/api/v1
  description: Local Development Server (XAMPP / Core PHP)
- url: http://localhost:8000/api/v1
  description: Local PHP CLI Dev Server

tags:
  - name: Health
    description: System health probes, liveness, and readiness endpoints.
  - name: Auth
    description: OAuth 2.0 password grant, token exchange, refresh tokens, session revocation, and password management.
  - name: Zero-Local-Data Schemas
    description: Dynamic server-driven UI schemas and field descriptors for zero-local-client caching.
  - name: Super Admin
    description: Multi-tenant SaaS platform administration, franchise creation, global audit logging, and module switches.
  - name: Admin Users
    description: Internal employee directory, role-based access control (RBAC), and user-to-territory mappings.
  - name: Admin Masters
    description: Master catalog registries (categories, dosage forms, packaging types, tax slabs, transporters, and global settings).
  - name: Geo
    description: Hierarchical geographic entities (States, Districts, Cities, Pincodes) with individual and bulk CRUD operations.
  - name: Admin Territories
    description: Operational field territories, boundary mappings, and assignment matrices.
  - name: Admin Products
    description: Pharmaceutical product master, SKU specifications, batch rules, and pricing master linkages.
  - name: Admin Pricing & Schemes
    description: Multi-tier party price lists, promotional discounts, quantity schemes, and trade schemes.
  - name: Admin Parties & Onboarding
    description: Commercial entities (Stockists, Retailers, Hospitals), self-registration approvals, and KYC verification.
  - name: Admin Leads & Follow-ups
    description: Business prospecting, doctor call scheduling, lead lifecycle conversions, and quarantined field activities.
  - name: Admin Inventory
    description: Goods Receipt Notes (GRN), FEFO batch stock ledgers, physical stock reconciliation, and quarantine lots.
  - name: Admin Orders
    description: Franchise sales order desk, credit checks, FEFO stock reservation, order holds, and fulfillment processing.
  - name: Admin Billing & Invoices
    description: Legally compliant GST tax invoice generation, sequence counters, credit/debit notes, and PDF exports.
  - name: Admin Dispatches
    description: Warehouse dispatch slips, packing slips, lorry receipts (LR), transporter assignments, and tracking.
  - name: Admin Payments
    description: Accounts receivable, PDC realization registry, cheque bounce handling, ledger entries, and ageing.
  - name: Field Force Automation (DCR)
    description: Medical Representative (MR) daily call reports, doctor tour planning, chemist visits, sample drops, and POBs.
  - name: Distributor Portal
    description: Dedicated B2B franchise partner commerce, online catalog, shopping cart calculation, invoices, and ledger.
  - name: Distributor Team & EA
    description: Franchise-owned field teams (EA / MRs), team order approvals, and scoped team lead monitoring.
  - name: Admin Reports
    description: Real-time business intelligence, sales team productivity, conversion ratios, and immutable audit logs.
  - name: Webhooks
    description: Inbound and outbound event integration engine with cryptographic signature verification.
  - name: Notifications
    description: In-app real-time alerting, unread counts, and channel delivery dispatchers.
  - name: General
    description: Universal utility, cross-module search, and platform-wide shared services.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your Bearer JWT access token issued by `/oauth/token`.

  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      description: Unique idempotency UUID string preventing duplicate mutating 
        writes.
      required: false
      schema:
        type: string
        example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
    XFranchiseRefHeader:
      name: X-Franchise-Ref
      in: header
      description: Optional tenant reference check. If provided, must match the 
        authenticated JWT franchise claim.
      required: false
      schema:
        type: string
        example: "FRN-MUMBAI000000000001"
    PageParam:
      name: page
      in: query
      description: 1-indexed page number for paginated listings.
      required: false
      schema:
        type: integer
        default: 1
    PerPageParam:
      name: per_page
      in: query
      description: Number of items returned per page (max 100).
      required: false
      schema:
        type: integer
        default: 20
        maximum: 100
    SearchParam:
      name: search
      in: query
      required: false
      schema: {type: string}
    DateFromParam:
      name: date_from
      in: query
      required: false
      description: Inclusive date filter in YYYY-MM-DD format.
      schema: {type: string, format: date}
    DateToParam:
      name: date_to
      in: query
      required: false
      description: Inclusive date filter in YYYY-MM-DD format.
      schema: {type: string, format: date}
    SortByParam:
      name: sort_by
      in: query
      required: false
      schema: {type: string}
    SortDirParam:
      name: sort_dir
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]

  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          oneOf:
          - type: object
          - type: array
            items:
              type: object
          nullable: true
        meta:
          type: object
          properties:
            request_id:
              type: string
              example: "01J9XKZM3QVRY4BPTDGWCNH7E2"
            page:
              type: integer
              example: 1
            per_page:
              type: integer
              example: 20
            total:
              type: integer
              example: 145
            total_pages:
              type: integer
              example: 8

    PublicRef:
      type: string
      description: Stable public resource reference. Internal numeric IDs are 
        not exposed.
      example: "ORD-01J9XKZ"

    ValidationFields:
      type: object
      additionalProperties:
        type: array
        items: {type: string}

    OrderStatus:
      type: string
      enum: [DRAFT, SUBMITTED, CONFIRMED, PROCESSING, DISPATCHED, DELIVERED, 
          CANCELLED]

    PermissionScope:
      type: string
      enum: [ALL, TERRITORY, TEAM, OWN, NONE]

    ApiErrorCode:
      type: string
      enum: [VALIDATION_FAILED, INVALID_REFERENCE, INVALID_ENUM, INVALID_DATE, 
          INVALID_PAGINATION, INVALID_SORT, UNAUTHORIZED, FORBIDDEN, 
          PERMISSION_DENIED, SCOPE_DENIED, USER_INACTIVE, NOT_FOUND, CONFLICT, 
          DUPLICATE, INVALID_STATE_TRANSITION, TENANT_MISMATCH, 
          IDEMPOTENCY_MISMATCH, REQUEST_IN_PROGRESS, BUSINESS_RULE_VIOLATION, 
          INTERNAL_ERROR]

    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: "VALIDATION_FAILED"
            message:
              type: string
              example: "The request payload failed validation."
            fields:
              $ref: '#/components/schemas/ValidationFields'
              example:
                mobile: ["Must be a valid 10-digit Indian mobile number."]
        meta:
          type: object
          properties:
            request_id:
              type: string
              example: "01J9XKZM3QVRY4BPTDGWCNH7E2"

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refresh_token:
          type: string
          example: "a8f7c9e1d3b542069e2b17f8a3c45678"
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          example: 900
        user:
          type: object
          properties:
            user_ref:
              type: string
              example: "USR-01J9XKZ"
            name:
              type: string
              example: "Admin User"
            email:
              type: string
              example: "admin@acme.test"
            role:
              type: string
              enum: [SUPER_ADMIN, FRANCHISE_ADMIN, SALES, DISTRIBUTOR]
            org_ref:
              type: string
              example: "ORG-ACME001"
            franchise_ref:
              type: string
              example: "FRN-MUM001"

    AuthMeResponse:
      type: object
      properties:
        user_ref: {type: string, example: "USR-01J9XKZ"}
        name: {type: string}
        email: {type: string, format: email}
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        role:
          type: string
          enum: [SUPER_ADMIN, FRANCHISE_ADMIN, SALES, DISTRIBUTOR]
        roles:
          type: array
          items: {type: string}
        permissions:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
        scopes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PermissionScope'
        scope: {type: string}
        org_ref: {type: string}
        franchise_ref: {type: string, nullable: true}
        party_ref: {type: string, nullable: true}
        impersonator_ref: {type: string, nullable: true}

    Product:
      type: object
      properties:
        product_ref:
          type: string
          example: "PRD-01J9XKZ"
        product_name:
          type: string
          example: "Paracetamol 650mg Tablets"
        sku:
          type: string
          example: "PARA-650"
        composition:
          type: string
          example: "Paracetamol IP 650mg"
        packing:
          type: string
          example: "10x10 Blister"
        hsn_code:
          type: string
          example: "300490"
        mrp:
          type: number
          format: float
          example: 35.00
        franchise_rate:
          type: number
          format: float
          example: 18.50
        pts:
          type: number
          format: float
        net_rate:
          type: number
          format: float
        gst_percent:
          type: number
          format: float
        description:
          type: string
        availability:
          type: string
          enum: [IN_STOCK, LOW_STOCK, OUT_OF_STOCK]
        gst_rate:
          type: number
          format: float
          example: 12.00
        status:
          type: string
          enum: [ACTIVE, INACTIVE, ARCHIVED]

    Party:
      type: object
      properties:
        party_ref:
          type: string
          example: "PTY-01J9XKZ"
        party_code:
          type: string
          example: "PTY-MUM-001"
        firm_name:
          type: string
          example: "Apex Distributors Pvt Ltd"
        contact_name:
          type: string
          example: "Rajesh Sharma"
        mobile:
          type: string
          example: "9876543210"
        whatsapp: {type: string}
        email:
          type: string
          example: "rajesh@apexdist.com"
        party_type: {type: string}
        gstin:
          type: string
          example: "27AAAAA0000A1Z5"
        drug_license_no:
          type: string
          example: "DL-MH-2023-998811"
        drug_license_validity: {type: string, format: date}
        area: {type: string}
        billing_address: {type: string}
        shipping_address: {type: string}
        pincode: {type: string}
        tier_ref: {type: string}
        credit_limit:
          type: number
          format: float
          example: 250000.00
        payment_terms_days: {type: integer}
        opening_outstanding: {type: number, format: float}
        status:
          type: string
          enum: [ACTIVE, INACTIVE, ARCHIVED]

    Lead:
      type: object
      properties:
        lead_ref:
          type: string
          example: "LED-01J9XKZ"
        contact_name:
          type: string
          example: "Amit Kumar"
        firm_name:
          type: string
          example: "Kumar Medicos"
        mobile:
          type: string
          example: "9822011223"
        status:
          type: string
          enum: [NEW, ASSIGNED, CONTACTED, INTERESTED, FOLLOW_UP, 
              DOCUMENTS_PENDING, QUALIFIED, CONVERTED, LOST, REJECTED, ARCHIVED]
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH, URGENT]
        assigned_user_ref:
          type: string
          example: "USR-SALES-001"

    Order:
      type: object
      properties:
        order_ref:
          type: string
          example: "ORD-01J9XKZ"
        order_no:
          type: string
          example: "ORD-2026-0001"
        client_order_ref:
          type: string
          example: "PO-APEX-9981"
        party_ref:
          type: string
          example: "PTY-01J9XKZ"
        status:
          type: string
          enum: [DRAFT, SUBMITTED, CONFIRMED, PROCESSING, DISPATCHED, DELIVERED, 
              CANCELLED]
        subtotal:
          type: number
          format: float
          example: 18500.00
        discount_total:
          type: number
          format: float
          example: 500.00
        gst_total:
          type: number
          format: float
          example: 2160.00
        grand_total:
          type: number
          format: float
          example: 20160.00
        tax_breakdown:
          $ref: '#/components/schemas/TaxBreakdown'

    TaxBreakdown:
      type: object
      description: Transport structure only; GST jurisdiction and rounding rules
        remain module decisions.
      properties:
        taxable_value: {type: number, format: float}
        cgst: {type: number, format: float}
        sgst: {type: number, format: float}
        igst: {type: number, format: float}
        tax_total: {type: number, format: float}
        grand_total: {type: number, format: float}
        rounding_adjustment: {type: number, format: float, nullable: true}

    Invoice:
      type: object
      properties:
        invoice_ref:
          type: string
          example: "INV-01J9XKZ"
        invoice_no:
          type: string
          example: "INV-2627-00001"
        order_ref:
          type: string
          example: "ORD-01J9XKZ"
        party_ref:
          type: string
          example: "PTY-01J9XKZ"
        invoice_date:
          type: string
          format: date
          example: "2026-09-20"
        due_date:
          type: string
          format: date
          example: "2026-10-20"
        supplier_state_ref: {type: string, nullable: true}
        place_of_supply_state_ref: {type: string, nullable: true}
        subtotal:
          type: number
          format: float
          example: 18500.00
        gst_total:
          type: number
          format: float
          example: 2160.00
        taxable_total: {type: number, format: float}
        cgst_total: {type: number, format: float}
        sgst_total: {type: number, format: float}
        igst_total: {type: number, format: float}
        rounding_adjustment: {type: number, format: float}
        tax_policy_code: {type: string, nullable: true}
        items: {type: array, items: {$ref: '#/components/schemas/InvoiceLine'}}
        tax_breakdown:
          $ref: '#/components/schemas/TaxBreakdown'
        grand_total:
          type: number
          format: float
          example: 20160.00
        paid_total:
          type: number
          format: float
          example: 5000.00
        status:
          type: string
          enum: [POSTED, CANCELLED]

    InvoiceLine:
      type: object
      properties:
        item_ref: {type: string}
        product_ref: {type: string}
        product_name_snapshot: {type: string}
        batch_no_snapshot: {type: string}
        paid_qty: {type: integer}
        free_qty: {type: integer}
        rate: {type: number, format: float}
        discount: {type: number, format: float}
        taxable_amount: {type: number, format: float}
        gst_percent: {type: number, format: float}
        cgst_percent: {type: number, format: float}
        sgst_percent: {type: number, format: float}
        igst_percent: {type: number, format: float}
        cgst_amount: {type: number, format: float}
        sgst_amount: {type: number, format: float}
        igst_amount: {type: number, format: float}
        total_tax: {type: number, format: float}
        line_total: {type: number, format: float}

    Pdc:
      type: object
      properties:
        pdc_ref: {type: string}
        party_ref: {type: string}
        amount: {type: number, format: float}
        cheque_number: {type: string}
        bank_name: {type: string, nullable: true}
        due_date: {type: string, format: date, nullable: true}
        status: {type: string, enum: [PENDING, REALIZED, BOUNCED, CANCELLED]}
        payment_ref: {type: string, nullable: true}
        realized_at: {type: string, format: date-time, nullable: true}
        bounced_at: {type: string, format: date-time, nullable: true}

    OutstandingInvoice:
      type: object
      required: [invoiceRef, invoiceNumber, partyRef, partyName, invoiceAmount, 
          allocatedAmount, balance, bucket, status]
      properties:
        invoiceRef: {type: string}
        invoiceNumber: {type: string}
        partyRef: {type: string}
        partyName: {type: string}
        invoiceAmount: {type: number, format: float}
        allocatedAmount: {type: number, format: float}
        balance: {type: number, format: float}
        dueDate: {type: string, format: date, nullable: true, description: 
            Authoritative invoice due date; never inferred by the API.}
        daysOverdue: {type: integer, nullable: true}
        bucket: {type: string, enum: [NOT_DUE, 0-30, 31-60, 61-90, 91-120, 120+, 
              UNCLASSIFIED]}
        status: {type: string, enum: [Unpaid, Partial]}

    PaymentOutstandingRow:
      type: object
      required: [invoiceNumber, partyName, dueDate, balance, bucket, status]
      properties:
        invoiceNumber: {type: string}
        partyName: {type: string}
        dueDate: {type: string, format: date, nullable: true}
        balance: {type: number, format: float}
        bucket: {type: string, enum: [NOT_DUE, 0-30, 31-60, 61-90, 91-120, 120+, 
              UNCLASSIFIED]}
        status: {type: string, enum: [Unpaid, Partial]}

    Notification:
      type: object
      properties:
        notification_ref:
          type: string
          example: "NTF-01J9XKZ"
        channel:
          type: string
          enum: [INAPP, WHATSAPP, EMAIL, SMS]
        event_type:
          type: string
          example: "FOLLOW_UP_DUE"
        status:
          type: string
          enum: [QUEUED, SENT, DELIVERED, READ, FAILED]
        created_at:
          type: string
          format: date-time

    RoleMutation:
      type: object
      required: [name, default_scope]
      properties:
        name: {type: string, maxLength: 120}
        description: {type: string, nullable: true, maxLength: 500}
        default_scope:
          type: string
          enum: [ALL, TERRITORY, TEAM, OWN, NONE]
        permissions:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
          example:
            leads: [view, create, edit]
        scope_overrides:
          type: object
          additionalProperties:
            type: string
            enum: [ALL, TERRITORY, TEAM, OWN, NONE]

    DashboardResponse:
      type: object
      required: [leads, follow_ups, orders, outstanding, near_expiry, sales_team]
      properties:
        leads: {$ref: '#/components/schemas/DashboardLeads'}
        follow_ups: {$ref: '#/components/schemas/DashboardFollowUps'}
        orders: {$ref: '#/components/schemas/DashboardOrders'}
        outstanding: {$ref: '#/components/schemas/DashboardOutstanding'}
        near_expiry: {$ref: '#/components/schemas/DashboardNearExpiry'}
        sales_team: {$ref: '#/components/schemas/DashboardSalesTeam'}
    DashboardLeads:
      type: object
      properties: {newToday: {type: integer}, unassignedCount: {type: integer}, 
          slaBreachedCount: {type: integer}, slaThresholdHours: {type: integer}, 
          slaTrend: {type: array, items: {type: object, properties: {date: {type: 
                  string}, totalCount: {type: integer}, breachedCount: {type: 
                  integer}}}}, conversionSeries: {type: array, items: {type: 
              object, properties: {status: {type: string}, count: {type: integer}}}}}
    DashboardFollowUps:
      type: object
      properties: {dueTodayCount: {type: integer}, overdueCount: {type: integer}}
    DashboardOrders:
      type: object
      properties: {activeCount: {type: integer}, territoryViolationCount: {type: 
            integer}, cancelledCount: {type: integer}, dispatchPendingCount: {type: 
            integer}, salesTrend: {type: array, items: {type: object, properties: {
              month: {type: string}, total: {type: number}, orderCount: {type: 
                  integer}}}}}
    DashboardOutstanding:
      type: object
      properties: {available: {type: boolean}, reason: {type: string, nullable: 
            true}, total: {type: number, nullable: true}, buckets: {type: array, 
            items: {type: object}}}
    DashboardNearExpiry:
      type: object
      properties: {count: {type: integer}, stockValue: {type: number}}
    DashboardSalesTeam:
      type: object
      properties: {available: {type: boolean}, rows: {type: array, items: {$ref: '#/components/schemas/SalesTeamProductivityRow'}}}
    ReportMeta:
      type: object
      required: [report_key, page, per_page, total, total_pages]
      properties: {report_key: {type: string}, page: {type: integer}, per_page: {
            type: integer}, total: {type: integer}, total_pages: {type: integer}}
    ReportResponse:
      type: object
      required: [rows, meta]
      properties:
        rows: {type: array, items: {oneOf: [$ref: '#/components/schemas/LeadSourceRow',
              $ref: '#/components/schemas/ResponseTimeRow', $ref: '#/components/schemas/ConversionRow',
              $ref: '#/components/schemas/SalesTeamProductivityRow', $ref: '#/components/schemas/TerritorySalesRow',
              $ref: '#/components/schemas/PartySalesRow', $ref: '#/components/schemas/ProductSalesRow',
              $ref: '#/components/schemas/SchemeUtilizationRow', $ref: '#/components/schemas/OrderStatusRow',
              $ref: '#/components/schemas/DispatchPendingRow', $ref: '#/components/schemas/BatchInventoryRow',
              $ref: '#/components/schemas/NearExpiryRow', $ref: '#/components/schemas/TerritoryViolationRow',
              $ref: '#/components/schemas/WebhookFailureRow', $ref: '#/components/schemas/WhatsappDeliveryRow',
              $ref: '#/components/schemas/PaymentOutstandingRow']}}
        meta: {$ref: '#/components/schemas/ReportMeta'}
    LeadSourceRow: {type: object, properties: {source: {type: string}, totalLeads: {
          type: integer}, converted: {type: integer}, conversionPct: {type: number}}}
    ResponseTimeRow: {type: object, properties: {leadRef: {type: string}, leadName: {
          type: string}, source: {type: string}, createdDate: {type: string, 
            format: date-time}, respondedAt: {type: string, format: date-time, 
            nullable: true}, durationHours: {type: number}, breached: {type: 
            string, enum: ['Yes', 'No']}}}
    ConversionRow: {type: object, properties: {stage: {type: string}, count: {type: 
            integer}}}
    SalesTeamProductivityRow: {type: object, properties: {userId: {type: string}, 
          name: {type: string}, leadsCount: {type: integer}, convertedCount: {type: 
            integer}, ordersCount: {type: integer}, ordersValue: {type: number}}}
    TerritorySalesRow: {type: object, properties: {state: {type: string}, district: {
          type: string}, orders: {type: integer}, totalSales: {type: number}}}
    PartySalesRow: {type: object, properties: {partyId: {type: string}, partyName: {
          type: string}, orders: {type: integer}, totalSales: {type: number}}}
    ProductSalesRow: {type: object, properties: {productId: {type: string}, 
          productName: {type: string}, qtySold: {type: integer}, freeQty: {type: 
            integer}, netSales: {type: number}}}
    SchemeUtilizationRow: {type: object, properties: {schemeId: {type: string}, 
          schemeName: {type: string}, timesApplied: {type: integer}, freeQtyGiven: {
          type: integer}, netSales: {type: number}}}
    OrderStatusRow: {type: object, properties: {status: {type: string}, count: {
            type: integer}, totalValue: {type: number}}}
    DispatchPendingRow: {type: object, properties: {invoiceNo: {type: string}, 
          partyName: {type: string}, status: {type: string}, orderDate: {type: 
            string, format: date}, total: {type: number}}}
    BatchInventoryRow: {type: object, properties: {productName: {type: string}, 
          batchNo: {type: string}, expiryDate: {type: string, format: date}, 
          availableQty: {type: integer}, status: {type: string}, stockValue: {type: 
            number}}}
    NearExpiryRow: {type: object, properties: {productName: {type: string}, 
          batchNo: {type: string}, expiryDate: {type: string, format: date}, 
          daysLeft: {type: integer}, availableQty: {type: integer}, stockValue: {
            type: number}}}
    TerritoryViolationRow: {type: object, properties: {invoiceNo: {type: string}, 
          partyName: {type: string}, reason: {type: string}, orderDate: {type: 
            string, format: date}}}
    WebhookFailureRow: {type: object, properties: {source: {type: string}, 
          eventType: {type: string}, receivedAt: {type: string, format: date-time},
        status: {type: string}, errorMessage: {type: string, nullable: true}}}
    WhatsappDeliveryRow: {type: object, properties: {recipientName: {type: string},
        templateName: {type: string}, status: {type: string}, sentAt: {type: 
            string, format: date-time}}}

security:
  - bearerAuth: []

paths:
  # ============================================================================
  # Health & Probes
  # ============================================================================
  /health:
    get:
      summary: Liveness probe
      description: Returns liveness status of the application.
      tags: [Health]
      security: []
      responses:
        '200':
          description: Application is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: "ok"}
                  timestamp: {type: string, example: "2026-09-20T18:47:00Z"}

  /ready:
    get:
      summary: Readiness probe
      description: Verifies database connectivity, storage write permissions, 
        and active encryption keys.
      tags: [Health]
      security: []
      responses:
        '200':
          description: Application and database are ready.
        '503':
          description: Application dependencies not ready.

  # ============================================================================
  # OAuth & Identity
  # ============================================================================
  /oauth/token:
    post:
      summary: Issue OAuth 2.0 access & refresh tokens
      description: Authenticates user credentials per surface client or rotates 
        a valid refresh token.
      tags: [Auth]
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum: [password, refresh_token]
                client_id:
                  type: string
                  enum: [crm-super, crm-admin, crm-sales, crm-portal]
                  example: "crm-admin"
                username:
                  type: string
                  example: "admin@acme.test"
                password:
                  type: string
                  example: "Secret@1234"
                refresh_token:
                  type: string
                  example: "a8f7c9e1d3b542069e2b17f8a3c45678"
      responses:
        '200':
          description: Tokens issued successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean, example: true}
                  data: {$ref: '#/components/schemas/AuthMeResponse'}
        '401':
          description: Invalid credentials or token reuse detected.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /oauth/revoke:
    post:
      summary: Revoke active session
      description: Revokes current user session family and access token.
      tags: [Auth]
      responses:
        '200':
          description: Session revoked successfully.

  /auth/me:
    get:
      summary: Get authenticated user profile
      description: Returns verified identity, permissions, tenant claims, and 
        surface role.
      tags: [Auth]
      responses:
        '200':
          description: Authenticated user details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean, example: true}
                  data: {$ref: '#/components/schemas/TokenResponse'}

  # ============================================================================
  # India Geographic Reference & Master Operations
  # ============================================================================
  /geo/states:
    get:
      summary: List all Indian states
      description: Returns list of normalized states with GST state code and reference.
      tags: [Geo]
      security: []
      responses:
        '200':
          description: List of active Indian states.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean, example: true}
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        state_ref: {type: string, example: "STA-MAHARASHTRA00001"}
                        state_code: {type: string, example: "MH"}
                        state_name: {type: string, example: "Maharashtra"}

  /geo/districts:
    get:
      summary: List districts (optionally filtered by state)
      tags: [Geo]
      security: []
      parameters:
      - name: state_ref
        in: query
        required: false
        schema: {type: string}
        example: "STA-MAHARASHTRA00001"
      responses:
        '200':
          description: List of districts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean, example: true}
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        district_ref: {type: string, example: "DST-MUMBAICITY0001"}
                        state_ref: {type: string, example: "STA-MAHARASHTRA00001"}
                        district_name: {type: string, example: "Mumbai City"}

  /geo/cities:
    get:
      summary: List all Indian cities
      tags: [Geo]
      security: []
      responses:
        '200':
          description: List of cities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean, example: true}
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        city_ref: {type: string, example: "CTY-MUMBAI00000001"}
                        district_ref: {type: string, example: "DST-MUMBAICITY0001"}
                        city_name: {type: string, example: "Mumbai"}

  /geo/pincodes:
    get:
      summary: List all Indian postal pincodes
      tags: [Geo]
      security: []
      responses:
        '200':
          description: List of pincodes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean, example: true}
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        pincode: {type: string, example: "400053"}
                        city_ref: {type: string, example: "CTY-MUMBAI00000001"}
                        district_ref: {type: string, example: "DST-MUMBAICITY0001"}
                        state_ref: {type: string, example: "STA-MAHARASHTRA00001"}

  /geo/pincodes/{pin}:
    get:
      summary: Resolve pincode to city, district, and state hierarchy
      tags: [Geo]
      security: []
      parameters:
      - name: pin
        in: path
        required: true
        description: 6-digit Indian postal pincode
        schema: {type: string}
        example: "400053"
      responses:
        '200':
          description: Resolved geographic details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean, example: true}
                  data:
                    type: object
                    properties:
                      pincode: {type: string, example: "400053"}
                      city_ref: {type: string, example: "CTY-MUMBAI00000001"}
                      city_name: {type: string, example: "Mumbai"}
                      district_ref: {type: string, example: "DST-MUMBAICITY0001"}
                      district_name: {type: string, example: "Mumbai City"}
                      state_ref: {type: string, example: "STA-MAHARASHTRA00001"}
                      state_name: {type: string, example: "Maharashtra"}

  /geo/states/{state_ref}/districts:
    get:
      summary: List districts for a specific state
      tags: [Geo]
      security: []
      parameters:
      - {name: state_ref, in: path, required: true, schema: {type: string}, example: "STA-MAHARASHTRA00001"}
      responses:
        '200':
          description: List of districts in the state.

  /geo/districts/{district_ref}/cities:
    get:
      summary: List cities for a specific district
      tags: [Geo]
      security: []
      parameters:
      - {name: district_ref, in: path, required: true, schema: {type: string}, example: "DST-MUMBAICITY0001"}
      responses:
        '200':
          description: List of cities in the district.

  /geo/cities/{city_ref}/pincodes:
    get:
      summary: List pincodes mapped to a specific city
      tags: [Geo]
      security: []
      parameters:
      - {name: city_ref, in: path, required: true, schema: {type: string}, example: "CTY-MUMBAI00000001"}
      responses:
        '200':
          description: List of pincodes in the city.

  /geo/search:
    get:
      summary: Unified geographic search across state, district, city, and pincode
      tags: [Geo]
      security: []
      parameters:
      - name: q
        in: query
        required: true
        description: Search term (pincode prefix, city name, district name, or state name)
        schema: {type: string}
        example: "Mumbai"
      responses:
        '200':
          description: Matching geographical hierarchy records.

  # ============================================================================
  # Admin Geographic Master CRUD (Management & Self-Service)
  # ============================================================================
  /admin/geo/states:
    post:
      summary: Create state master
      tags: [Geo]
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state_code, state_name]
              properties:
                state_code: {type: string, example: "MH", description: "2-letter uppercase GST state code"}
                state_name: {type: string, example: "Maharashtra"}
      responses:
        '201':
          description: State created successfully.

  /admin/geo/states/bulk:
    post:
      summary: Bulk upload state masters
      description: Bulk upload or update multiple states at once. If state_code exists, it will update; otherwise it creates a new state.
      tags: [Geo]
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  description: List of state records to import
                  items:
                    type: object
                    required: [state_code, state_name]
                    properties:
                      state_code: {type: string, example: "KA", description: "GST 2-letter state code"}
                      state_name: {type: string, example: "Karnataka"}
            example:
              items:
                - state_code: "MH"
                  state_name: "Maharashtra"
                - state_code: "GJ"
                  state_name: "Gujarat"
                - state_code: "KA"
                  state_name: "Karnataka"
      responses:
        '200':
          description: Bulk upload results with summary and records status.
          content:
            application/json:
              example:
                success: true
                data:
                  total: 3
                  inserted: 1
                  updated: 2
                  failed: 0
                  errors: []

  /admin/geo/states/{ref}:
    parameters:
    - {name: ref, in: path, required: true, schema: {type: string}, example: "STA-MAHARASHTRA00001"}
    get:
      summary: Show state details
      tags: [Geo]
      security: [bearerAuth: []]
      responses:
        '200':
          description: State details.
    patch:
      summary: Update state master
      tags: [Geo]
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state_code: {type: string, example: "MH"}
                state_name: {type: string, example: "Maharashtra"}
      responses:
        '200':
          description: State updated.
    delete:
      summary: Delete state master
      tags: [Geo]
      security: [bearerAuth: []]
      responses:
        '200':
          description: State deleted.

  /admin/geo/districts:
    post:
      summary: Create district master
      tags: [Geo]
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state_ref, district_name]
              properties:
                state_ref: {type: string, example: "STA-MAHARASHTRA00001"}
                district_name: {type: string, example: "Pune"}
      responses:
        '201':
          description: District created.

  /admin/geo/districts/bulk:
    post:
      summary: Bulk upload district masters
      description: Bulk upload districts linking each district to its parent state using state_ref (or state_code).
      tags: [Geo]
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  description: List of district records to import
                  items:
                    type: object
                    required: [district_name]
                    properties:
                      district_name: {type: string, example: "Pune"}
                      state_ref: {type: string, example: "STA-MAHARASHTRA00001", description: "Reference to parent state"}
                      state_code: {type: string, example: "MH", description: "Alternative state code fallback"}
            example:
              items:
                - state_ref: "STA-MAHARASHTRA00001"
                  district_name: "Pune"
                - state_ref: "STA-MAHARASHTRA00001"
                  district_name: "Nagpur"
                - state_code: "MH"
                  district_name: "Thane"
      responses:
        '200':
          description: Bulk upload results with summary and records status.
          content:
            application/json:
              example:
                success: true
                data:
                  total: 3
                  inserted: 2
                  updated: 1
                  failed: 0
                  errors: []

  /admin/geo/districts/{ref}:
    parameters:
    - {name: ref, in: path, required: true, schema: {type: string}, example: "DST-MUMBAICITY0001"}
    get:
      summary: Show district details
      tags: [Geo]
      security: [bearerAuth: []]
      responses:
        '200':
          description: District details.
    patch:
      summary: Update district master
      tags: [Geo]
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state_ref: {type: string, example: "STA-MAHARASHTRA00001"}
                district_name: {type: string, example: "Pune"}
      responses:
        '200':
          description: District updated.
    delete:
      summary: Delete district master
      tags: [Geo]
      security: [bearerAuth: []]
      responses:
        '200':
          description: District deleted.

  /admin/geo/cities:
    post:
      summary: Create city master
      tags: [Geo]
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [district_ref, city_name]
              properties:
                district_ref: {type: string, example: "DST-MUMBAICITY0001"}
                city_name: {type: string, example: "Andheri"}
      responses:
        '201':
          description: City created.

  /admin/geo/cities/bulk:
    post:
      summary: Bulk upload city masters
      description: Bulk upload cities linking each city to its parent district using district_ref.
      tags: [Geo]
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  description: List of city records to import
                  items:
                    type: object
                    required: [district_ref, city_name]
                    properties:
                      city_name: {type: string, example: "Bandra"}
                      district_ref: {type: string, example: "DST-MUMBAICITY0001", description: "Reference to parent district"}
            example:
              items:
                - district_ref: "DST-MUMBAICITY0001"
                  city_name: "Bandra"
                - district_ref: "DST-MUMBAICITY0001"
                  city_name: "Borivali"
                - district_ref: "DST-MUMBAICITY0001"
                  city_name: "Kurla"
      responses:
        '200':
          description: Bulk upload results with summary and records status.
          content:
            application/json:
              example:
                success: true
                data:
                  total: 3
                  inserted: 3
                  updated: 0
                  failed: 0
                  errors: []

  /admin/geo/cities/{ref}:
    parameters:
    - {name: ref, in: path, required: true, schema: {type: string}, example: "CTY-MUMBAI00000001"}
    get:
      summary: Show city details
      tags: [Geo]
      security: [bearerAuth: []]
      responses:
        '200':
          description: City details.
    patch:
      summary: Update city master
      tags: [Geo]
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                district_ref: {type: string, example: "DST-MUMBAICITY0001"}
                city_name: {type: string, example: "Andheri West"}
      responses:
        '200':
          description: City updated.
    delete:
      summary: Delete city master
      tags: [Geo]
      security: [bearerAuth: []]
      responses:
        '200':
          description: City deleted.

  /admin/geo/pincodes:
    post:
      summary: Create postal pincode master
      tags: [Geo]
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pincode, district_ref, state_ref]
              properties:
                pincode: {type: string, example: "400053", description: "6-digit postal code"}
                city_ref: {type: string, example: "CTY-MUMBAI00000001", nullable: true}
                district_ref: {type: string, example: "DST-MUMBAICITY0001"}
                state_ref: {type: string, example: "STA-MAHARASHTRA00001"}
      responses:
        '201':
          description: Pincode created.

  /admin/geo/pincodes/bulk:
    post:
      summary: Bulk upload postal pincode masters
      description: Bulk upload or upsert pincodes linking them to state_ref, district_ref, and optional city_ref.
      tags: [Geo]
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  description: List of pincode records to import
                  items:
                    type: object
                    required: [pincode, district_ref, state_ref]
                    properties:
                      pincode: {type: string, example: "400053", description: "6-digit postal pincode"}
                      state_ref: {type: string, example: "STA-MAHARASHTRA00001"}
                      district_ref: {type: string, example: "DST-MUMBAICITY0001"}
                      city_ref: {type: string, example: "CTY-MUMBAI00000001", nullable: true}
            example:
              items:
                - pincode: "400053"
                  state_ref: "STA-MAHARASHTRA00001"
                  district_ref: "DST-MUMBAICITY0001"
                  city_ref: "CTY-MUMBAI00000001"
                - pincode: "400054"
                  state_ref: "STA-MAHARASHTRA00001"
                  district_ref: "DST-MUMBAICITY0001"
                  city_ref: "CTY-MUMBAI00000001"
                - pincode: "400055"
                  state_ref: "STA-MAHARASHTRA00001"
                  district_ref: "DST-MUMBAICITY0001"
                  city_ref: "CTY-MUMBAI00000001"
      responses:
        '200':
          description: Bulk upload results with summary and records status.
          content:
            application/json:
              example:
                success: true
                data:
                  total: 3
                  inserted: 3
                  updated: 0
                  failed: 0
                  errors: []

  /admin/geo/pincodes/{ref}:
    parameters:
    - {name: ref, in: path, required: true, schema: {type: string}, example: "400053", description: "6-digit postal pincode"}
    get:
      summary: Show pincode details
      tags: [Geo]
      security: [bearerAuth: []]
      responses:
        '200':
          description: Pincode details with resolved city, district, and state.
    patch:
      summary: Update postal pincode master
      tags: [Geo]
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                city_ref: {type: string, example: "CTY-MUMBAI00000001"}
                district_ref: {type: string, example: "DST-MUMBAICITY0001"}
                state_ref: {type: string, example: "STA-MAHARASHTRA00001"}
      responses:
        '200':
          description: Pincode updated.
    delete:
      summary: Delete postal pincode master
      tags: [Geo]
      security: [bearerAuth: []]
      responses:
        '200':
          description: Pincode deleted.

  # ============================================================================
  # Super Admin Endpoints
  # ============================================================================
  /super/dashboard/stats:
    get:
      summary: Platform overview statistics
      description: Returns multi-tenant counts, job queue status, and system 
        health.
      tags: [Super Admin]
      responses:
        '200':
          description: Platform statistics.

  /super/organizations:
    get:
      summary: List organizations
      tags: [Super Admin]
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Organizations list.
    post:
      summary: Create organization
      tags: [Super Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_code, org_name]
              properties:
                org_code: {type: string, example: "ACME"}
                org_name: {type: string, example: "Acme Healthcare"}
      responses:
        '201':
          description: Organization created.

  /super/organizations/{ref}:
    parameters:
    - name: ref
      in: path
      required: true
      schema: {type: string}
    get:
      summary: Get organization details
      tags: [Super Admin]
      responses:
        '200':
          description: Organization details.
        '404':
          description: Organization not found.
    patch:
      summary: Update organization
      tags: [Super Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                org_name: {type: string}
                brand_primary_hex: {type: string, example: "#0D9488"}
                brand_accent_hex: {type: string, example: "#FF7A00"}
      responses:
        '200':
          description: Organization updated.
        '404':
          description: Organization not found.

  /super/franchises:
    get:
      summary: List franchises
      tags: [Super Admin]
      responses:
        '200':
          description: Franchises list.
    post:
      summary: Create franchise under an organization
      tags: [Super Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_ref, franchise_code, franchise_name]
              properties:
                org_ref: {type: string, example: "ORG-ACME"}
                franchise_code: {type: string, example: "MUMBAI"}
                franchise_name: {type: string, example: "Acme PCD Mumbai"}
      responses:
        '201':
          description: Franchise created.

  /super/franchises/{ref}:
    parameters:
    - name: ref
      in: path
      required: true
      schema: {type: string}
    get:
      summary: Get franchise details
      tags: [Super Admin]
      responses:
        '200':
          description: Franchise details.
        '404':
          description: Franchise not found.
    patch:
      summary: Update franchise
