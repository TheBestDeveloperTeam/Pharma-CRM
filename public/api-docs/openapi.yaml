  /ui/forms:
    get:
      summary: List all active dynamic UI form schemas
      tags: [Zero-Local-Data Schemas]
      security: [bearerAuth: []]
      responses:
        '200':
          description: List of registered UI form schemas.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    schema_ref: {type: string, example: "SCH-FRM-LEAD0000000001"}
                    form_key: {type: string, example: "lead_create"}
                    title: {type: string, example: "Create New Sales Lead"}
                    description: {type: string}
                    entity_type: {type: string, example: "lead"}
                    version: {type: integer, example: 1}
                    status: {type: string, example: "ACTIVE"}

  /ui/forms/{form_key}:
    get:
      summary: Retrieve dynamic form schema with field definitions and validation rules
      tags: [Zero-Local-Data Schemas]
      security: [bearerAuth: []]
      parameters:
      - name: form_key
        in: path
        required: true
        description: Unique form key (e.g. lead_create, party_create, product_create)
        schema: {type: string}
      - name: resolve_options
        in: query
        required: false
        description: Whether to inline resolved catalog options directly into field definitions
        schema: {type: string, enum: ["0", "1"], default: "1"}
      responses:
        '200':
          description: Complete form schema with ordered fields, validation rules, types, and options.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_ref: {type: string}
                  form_key: {type: string}
                  title: {type: string}
                  description: {type: string}
                  entity_type: {type: string}
                  version: {type: integer}
                  fields:
                    type: array
                    items:
                      type: object
                      properties:
                        field_ref: {type: string}
                        field_name: {type: string}
                        label: {type: string}
                        field_type: {type: string, example: "text"}
                        placeholder: {type: string}
                        default_value: {type: string}
                        is_required: {type: boolean}
                        is_readonly: {type: boolean}
                        validation_rules: {type: object}
                        options_source_type: {type: string, enum: [NONE, CATALOG_MASTER, API_ENDPOINT, STATIC_JSON]}
                        options_source_key: {type: string}
                        options: {type: array, items: {type: object}}
                        step_number: {type: integer}
                        grid_width: {type: integer}
                        sort_order: {type: integer}

  /ui/forms/{form_key}/validate:
    post:
      summary: Validate submission payload against database-driven form schema rules
      tags: [Zero-Local-Data Schemas]
      security: [bearerAuth: []]
      parameters:
      - name: form_key
        in: path
        required: true
        description: Unique form key (e.g. party_create, order_create, onboarding_register)
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Key-value map of form field values and optional step_number
      responses:
        '200':
          description: Payload is completely valid according to database schema rules.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: {type: boolean, example: true}
                  errors: {type: object}
                  validated_data: {type: object}
        '422':
          description: Validation failed with field-level error messages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: {type: boolean, example: false}
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items: {type: string}
                  validated_data: {type: object}

