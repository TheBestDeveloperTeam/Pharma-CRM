openapi: 3.0.3
info:
  title: Pharma CRM & Sales Force Automation API
  version: 3.0.0
  description: |
    Comprehensive, enterprise-grade RESTful API documentation for Pharma CRM & Sales Force Automation.
    
    ### Architecture & Golden Rules
    - **Multi-Tenancy:** Row-level tenancy enforced via `org_ref` and `franchise_ref`.
    - **Authentication:** OAuth 2.0 style Bearer JWT access tokens (15-minute expiry) and rotating refresh tokens with reuse detection.
    - **Idempotency:** Mutating `/api/v1` operations may send `Idempotency-Key` (16-120 ASCII letters, digits, `_` or `-`). Matching requests replay the complete response envelope; a different fingerprint returns `409 IDEMPOTENCY_MISMATCH`.
    - **Deterministic Numbering:** Sequential gapless numbering for Orders, Invoices, Dispatches, and Payments via atomic sequence counters.
    - **Inventory & Pricing:** Strict server-side First-Expiry-First-Out (FEFO) allocation and hierarchical priority pricing (Party > Tier > Default).
    - **Auditability:** Immutable, append-only audit trail on all business and security transactions.
    
    ### The 9 Complete User Journeys (E2E)
    This specification strictly implements the 9 core workflows across all roles:
    1. **Platform Provisioning (Super Admin):** Organization and franchise setup, auditing.
    2. **Franchise Onboarding (Admin):** Users, catalog, pricing, and territories setup.
    3. **Lead & Prospecting (Sales):** Lead capture, territory management, and follow-ups.
    4. **Inventory & Warehouse (Admin):** Goods receipt (GRN), FEFO batch tracking, and adjustments.
    5. **Portal Catalog (Distributor):** Live catalog browsing and dynamic cart calculation.
    6. **Sales Orders (Sales/Distributor):** Order submission and FEFO stock reservation upon approval.
    7. **Billing & Invoicing (Admin):** Tax invoice generation with snapshot pricing and GST.
    8. **Logistics & Dispatch (Admin):** Transporter assignment and delivery tracking (LR).
    9. **Payments & Ledger (Admin):** Payment recording, invoice allocation, and outstanding sync.
servers:
  - url: https://crm.easysolutins24.in/api/v1
    description: Production Cloud Server (cPanel Shared Hosting)
  - url: http://crm/api/v1
    description: Local Development Server (XAMPP / Core PHP)
  - url: http://localhost:8000/api/v1
    description: Local PHP CLI Dev Server

tags:
  - name: Health
    description: Platform and database readiness probes
  - name: Auth
    description: OAuth 2.0 token issuance, refresh rotation, revocation, and identity
  - name: Geo
    description: Public India geographic hierarchy (States, Districts, Pincodes)
  - name: Super Admin
    description: Multi-tenant organization and franchise management, impersonation, audit & platform stats
  - name: Admin Users
    description: User management within a franchise (Admin, Sales, Distributor)
  - name: Admin Masters
    description: Product categories, pricing tiers, transporters, templates, settings
  - name: Admin Products
    description: Pharmaceutical catalogue, SKU, HSN, packing, and composition CRUD
  - name: Admin Pricing & Schemes
    description: Hierarchical pricing rules, quantity schemes (10+1), and calculation endpoints
  - name: Admin Leads & Follow-ups
    description: Lead acquisition, assignment, state machine, and mandatory follow-up tracking
  - name: Admin Parties & Onboarding
    description: PCD franchise partners, distributors, customer onboarding invites, and ledger
  - name: Admin Territories
    description: District/pincode territory allocations, exclusive locks, pre-billing validator & overrides
  - name: Admin Inventory
    description: Batch receipts, FEFO allocations, physical stock adjustments, and near-expiry alerts
  - name: Admin Orders
    description: Order status contract (DRAFT -> SUBMITTED -> CONFIRMED -> PROCESSING -> DISPATCHED -> DELIVERED / CANCELLED); transition authority is module-specific.
  - name: Admin Billing & Invoices
    description: Tax invoice generation with price/party snapshots, gapless sequence numbers, and GST breakdown
  - name: Admin Dispatches
    description: Transporter assignment, Lorry Receipt (LR) tracking, and dispatch delivery confirmation
  - name: Admin Payments
    description: Payment recording, invoice allocation, payment reversal, and outstanding balance sync
  - name: Admin Reports
    description: 12 comprehensive analytical, operational, and financial reports with JSON/CSV streaming
  - name: Webhooks
    description: B2B lead generation webhook sources (HMAC-SHA256 verified) and ingestion
  - name: Notifications
    description: In-app, Email, WhatsApp, and SMS notification dispatch, bell polling, and read tracking
  - name: Distributor Portal
    description: Distributor self-service portal for catalogue browsing, server-side cart pricing, order placement, and invoice tracking

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your Bearer JWT access token issued by `/oauth/token`.

  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      description: Unique idempotency UUID string preventing duplicate mutating writes.
      required: false
      schema:
        type: string
        example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
    XFranchiseRefHeader:
      name: X-Franchise-Ref
      in: header
      description: Optional tenant reference check. If provided, must match the authenticated JWT franchise claim.
      required: false
      schema:
        type: string
        example: "FRN-MUMBAI000000000001"
    PageParam:
      name: page
      in: query
      description: 1-indexed page number for paginated listings.
      required: false
      schema:
        type: integer
        default: 1
    PerPageParam:
      name: per_page
      in: query
      description: Number of items returned per page (max 100).
      required: false
      schema:
        type: integer
        default: 20
        maximum: 100
    SearchParam:
      name: search
      in: query
      required: false
      schema: { type: string }
    DateFromParam:
      name: date_from
      in: query
      required: false
      description: Inclusive date filter in YYYY-MM-DD format.
      schema: { type: string, format: date }
    DateToParam:
      name: date_to
      in: query
      required: false
      description: Inclusive date filter in YYYY-MM-DD format.
      schema: { type: string, format: date }
    SortByParam:
      name: sort_by
      in: query
      required: false
      schema: { type: string }
    SortDirParam:
      name: sort_dir
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]

  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          oneOf:
            - type: object
            - type: array
          nullable: true
        meta:
          type: object
          properties:
            request_id:
              type: string
              example: "01J9XKZM3QVRY4BPTDGWCNH7E2"
            page:
              type: integer
              example: 1
            per_page:
              type: integer
              example: 20
            total:
              type: integer
              example: 145
            total_pages:
              type: integer
              example: 8

    PublicRef:
      type: string
      description: Stable public resource reference. Internal numeric IDs are not exposed.
      example: "ORD-01J9XKZ"

    ValidationFields:
      type: object
      additionalProperties:
        type: array
        items: { type: string }

    OrderStatus:
      type: string
      enum: [DRAFT, SUBMITTED, CONFIRMED, PROCESSING, DISPATCHED, DELIVERED, CANCELLED]

    PermissionScope:
      type: string
      enum: [ALL, TERRITORY, TEAM, OWN, NONE]

    ApiErrorCode:
      type: string
      enum: [VALIDATION_FAILED, INVALID_REFERENCE, INVALID_ENUM, INVALID_DATE, INVALID_PAGINATION, INVALID_SORT, UNAUTHORIZED, FORBIDDEN, PERMISSION_DENIED, SCOPE_DENIED, USER_INACTIVE, NOT_FOUND, CONFLICT, DUPLICATE, INVALID_STATE_TRANSITION, TENANT_MISMATCH, IDEMPOTENCY_MISMATCH, REQUEST_IN_PROGRESS, BUSINESS_RULE_VIOLATION, INTERNAL_ERROR]

    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: "VALIDATION_FAILED"
            message:
              type: string
              example: "The request payload failed validation."
            fields:
              $ref: '#/components/schemas/ValidationFields'
              example:
                mobile: ["Must be a valid 10-digit Indian mobile number."]
        meta:
          type: object
          properties:
            request_id:
              type: string
              example: "01J9XKZM3QVRY4BPTDGWCNH7E2"

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refresh_token:
          type: string
          example: "a8f7c9e1d3b542069e2b17f8a3c45678"
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          example: 900
        user:
          type: object
          properties:
            user_ref:
              type: string
              example: "USR-01J9XKZ"
            name:
              type: string
              example: "Admin User"
            email:
              type: string
              example: "admin@acme.test"
            role:
              type: string
              enum: [SUPER_ADMIN, FRANCHISE_ADMIN, SALES, DISTRIBUTOR]
            org_ref:
              type: string
              example: "ORG-ACME001"
            franchise_ref:
              type: string
              example: "FRN-MUM001"

    AuthMeResponse:
      type: object
      properties:
        user_ref: { type: string, example: "USR-01J9XKZ" }
        name: { type: string }
        email: { type: string, format: email }
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        role:
          type: string
          enum: [SUPER_ADMIN, FRANCHISE_ADMIN, SALES, DISTRIBUTOR]
        roles:
          type: array
          items: { type: string }
        permissions:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        scopes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PermissionScope'
        scope: { type: string }
        org_ref: { type: string }
        franchise_ref: { type: string, nullable: true }
        party_ref: { type: string, nullable: true }
        impersonator_ref: { type: string, nullable: true }

    Product:
      type: object
      properties:
        product_ref:
          type: string
          example: "PRD-01J9XKZ"
        product_name:
          type: string
          example: "Paracetamol 650mg Tablets"
        sku:
          type: string
          example: "PARA-650"
        composition:
          type: string
          example: "Paracetamol IP 650mg"
        packing:
          type: string
          example: "10x10 Blister"
        hsn_code:
          type: string
          example: "300490"
        mrp:
          type: number
          format: float
          example: 35.00
        franchise_rate:
          type: number
          format: float
          example: 18.50
        pts:
          type: number
          format: float
        net_rate:
          type: number
          format: float
        gst_percent:
          type: number
          format: float
        description:
          type: string
        availability:
          type: string
          enum: [IN_STOCK, LOW_STOCK, OUT_OF_STOCK]
        gst_rate:
          type: number
          format: float
          example: 12.00
        status:
          type: string
          enum: [ACTIVE, INACTIVE, ARCHIVED]

    Party:
      type: object
      properties:
        party_ref:
          type: string
          example: "PTY-01J9XKZ"
        party_code:
          type: string
          example: "PTY-MUM-001"
        firm_name:
          type: string
          example: "Apex Distributors Pvt Ltd"
        contact_name: { type: string }
        mobile: { type: string }
        whatsapp: { type: string }
        email: { type: string, format: email }
        party_type: { type: string }
        gstin: { type: string }
        drug_license_no: { type: string }
        drug_license_validity: { type: string, format: date }
        area: { type: string }
        billing_address: { type: string }
        shipping_address: { type: string }
        pincode: { type: string }
        tier_ref: { type: string }
        credit_limit: { type: number, format: float }
        payment_terms_days: { type: integer }
        opening_outstanding: { type: number, format: float }
        status: { type: string, enum: [ACTIVE, INACTIVE, ARCHIVED] }
        contact_name:
          type: string
          example: "Rajesh Sharma"
        mobile:
          type: string
          example: "9876543210"
        email:
          type: string
          example: "rajesh@apexdist.com"
        gstin:
          type: string
          example: "27AAAAA0000A1Z5"
        drug_license_no:
          type: string
          example: "DL-MH-2023-998811"
        credit_limit:
          type: number
          format: float
          example: 250000.00
        status:
          type: string
          enum: [ACTIVE, INACTIVE, ARCHIVED]

    Lead:
      type: object
      properties:
        lead_ref:
          type: string
          example: "LED-01J9XKZ"
        contact_name:
          type: string
          example: "Amit Kumar"
        firm_name:
          type: string
          example: "Kumar Medicos"
        mobile:
          type: string
          example: "9822011223"
        status:
          type: string
          enum: [NEW, ASSIGNED, CONTACTED, INTERESTED, FOLLOW_UP, DOCUMENTS_PENDING, QUALIFIED, CONVERTED, LOST, REJECTED, ARCHIVED]
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH, URGENT]
        assigned_user_ref:
          type: string
          example: "USR-SALES-001"

    Order:
      type: object
      properties:
        order_ref:
          type: string
          example: "ORD-01J9XKZ"
        order_no:
          type: string
          example: "ORD-2026-0001"
        client_order_ref:
          type: string
          example: "PO-APEX-9981"
        party_ref:
          type: string
          example: "PTY-01J9XKZ"
        status:
          type: string
          enum: [DRAFT, SUBMITTED, CONFIRMED, PROCESSING, DISPATCHED, DELIVERED, CANCELLED]
        subtotal:
          type: number
          format: float
          example: 18500.00
        discount_total:
          type: number
          format: float
          example: 500.00
        gst_total:
          type: number
          format: float
          example: 2160.00
        grand_total:
          type: number
          format: float
          example: 20160.00
        tax_breakdown:
          $ref: '#/components/schemas/TaxBreakdown'

    TaxBreakdown:
      type: object
      description: Transport structure only; GST jurisdiction and rounding rules remain module decisions.
      properties:
        taxable_value: { type: number, format: float }
        cgst: { type: number, format: float }
        sgst: { type: number, format: float }
        igst: { type: number, format: float }
        tax_total: { type: number, format: float }
        grand_total: { type: number, format: float }
        rounding_adjustment: { type: number, format: float, nullable: true }

    Invoice:
      type: object
      properties:
        invoice_ref:
          type: string
          example: "INV-01J9XKZ"
        invoice_no:
          type: string
          example: "INV-2627-00001"
        order_ref:
          type: string
          example: "ORD-01J9XKZ"
        party_ref:
          type: string
          example: "PTY-01J9XKZ"
        invoice_date:
          type: string
          format: date
          example: "2026-09-20"
        due_date:
          type: string
          format: date
          example: "2026-10-20"
        subtotal:
          type: number
          format: float
          example: 18500.00
        gst_total:
          type: number
          format: float
          example: 2160.00
        tax_breakdown:
          $ref: '#/components/schemas/TaxBreakdown'
        grand_total:
          type: number
          format: float
          example: 20160.00
        paid_total:
          type: number
          format: float
          example: 5000.00
        status:
          type: string
          enum: [POSTED, CANCELLED]

    Notification:
      type: object
      properties:
        notification_ref:
          type: string
          example: "NTF-01J9XKZ"
        channel:
          type: string
          enum: [INAPP, WHATSAPP, EMAIL, SMS]
        event_type:
          type: string
          example: "FOLLOW_UP_DUE"
        status:
          type: string
          enum: [QUEUED, SENT, DELIVERED, READ, FAILED]
        created_at:
          type: string
          format: date-time

    RoleMutation:
      type: object
      required: [name, default_scope]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, nullable: true, maxLength: 500 }
        default_scope:
          type: string
          enum: [ALL, TERRITORY, TEAM, OWN, NONE]
        permissions:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          example:
            leads: [view, create, edit]
        scope_overrides:
          type: object
          additionalProperties:
            type: string
            enum: [ALL, TERRITORY, TEAM, OWN, NONE]

security:
  - bearerAuth: []

paths:
  # ============================================================================
  # Health & Probes
  # ============================================================================
  /health:
    get:
      summary: Liveness probe
      description: Returns liveness status of the application.
      tags: [Health]
      security: []
      responses:
        '200':
          description: Application is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  timestamp: { type: string, example: "2026-09-20T18:47:00Z" }

  /ready:
    get:
      summary: Readiness probe
      description: Verifies database connectivity, storage write permissions, and active encryption keys.
      tags: [Health]
      security: []
      responses:
        '200':
          description: Application and database are ready.
        '503':
          description: Application dependencies not ready.

  # ============================================================================
  # OAuth & Identity
  # ============================================================================
  /oauth/token:
    post:
      summary: Issue OAuth 2.0 access & refresh tokens
      description: Authenticates user credentials per surface client or rotates a valid refresh token.
      tags: [Auth]
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum: [password, refresh_token]
                client_id:
                  type: string
                  enum: [crm-super, crm-admin, crm-sales, crm-portal]
                  example: "crm-admin"
                username:
                  type: string
                  example: "admin@acme.test"
                password:
                  type: string
                  example: "Secret@1234"
                refresh_token:
                  type: string
                  example: "a8f7c9e1d3b542069e2b17f8a3c45678"
      responses:
        '200':
          description: Tokens issued successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AuthMeResponse' }
        '401':
          description: Invalid credentials or token reuse detected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /oauth/revoke:
    post:
      summary: Revoke active session
      description: Revokes current user session family and access token.
      tags: [Auth]
      responses:
        '200':
          description: Session revoked successfully.

  /auth/me:
    get:
      summary: Get authenticated user profile
      description: Returns verified identity, permissions, tenant claims, and surface role.
      tags: [Auth]
      responses:
        '200':
          description: Authenticated user details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/TokenResponse' }

  # ============================================================================
  # India Geographic Reference
  # ============================================================================
  /geo/states:
    get:
      summary: List Indian states
      tags: [Geo]
      security: []
      responses:
        '200':
          description: List of states.

  /geo/districts:
    get:
      summary: List districts by state
      tags: [Geo]
      security: []
      parameters:
        - name: state_ref
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: List of districts.

  /geo/pincodes/{pin}:
    get:
      summary: Resolve pincode to city, district, and state
      tags: [Geo]
      security: []
      parameters:
        - name: pin
          in: path
          required: true
          schema: { type: string, example: "400001" }
      responses:
        '200':
          description: Resolved geographic details.

  # ============================================================================
  # Super Admin Endpoints
  # ============================================================================
  /super/dashboard/stats:
    get:
      summary: Platform overview statistics
      description: Returns multi-tenant counts, job queue status, and system health.
      tags: [Super Admin]
      responses:
        '200':
          description: Platform statistics.

  /super/organizations:
    get:
      summary: List organizations
      tags: [Super Admin]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Organizations list.
    post:
      summary: Create organization
      tags: [Super Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_code, org_name]
              properties:
                org_code: { type: string, example: "ACME" }
                org_name: { type: string, example: "Acme Healthcare" }
      responses:
        '201':
          description: Organization created.

  /super/franchises:
    get:
      summary: List franchises
      tags: [Super Admin]
      responses:
        '200':
          description: Franchises list.
    post:
      summary: Create franchise under an organization
      tags: [Super Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_ref, franchise_code, franchise_name]
              properties:
                org_ref: { type: string, example: "ORG-ACME" }
                franchise_code: { type: string, example: "MUMBAI" }
                franchise_name: { type: string, example: "Acme PCD Mumbai" }
      responses:
        '201':
          description: Franchise created.

  /super/impersonate/{ref}:
    post:
      summary: Impersonate a user with time-boxed audit
      description: Issues a 15-minute impersonation JWT carrying original super admin identity.
      tags: [Super Admin]
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Impersonation token issued.

  /super/audit:
    get:
      summary: Platform-wide audit trail
      tags: [Super Admin]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Audit logs list.

  /super/security-events:
    get:
      summary: Security and tenant bypass events
      tags: [Super Admin]
      responses:
        '200':
          description: Security logs list.

  # ============================================================================
  # Franchise Admin: Users & Masters
  # ============================================================================
  /admin/users:
    get:
      summary: List franchise users
      tags: [Admin Users]
      responses:
        '200':
          description: Users list.
    post:
      summary: Create new franchise user
      tags: [Admin Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, role]
              properties:
                email: { type: string, format: email }
                name: { type: string }
                role: { type: string, enum: [FRANCHISE_ADMIN, SALES, DISTRIBUTOR] }
                phone: { type: string }
      responses:
        '201':
          description: User created.

  /admin/categories:
    get:
      summary: List product categories
      tags: [Admin Masters]
      responses:
        '200':
          description: Categories list.
    post:
      summary: Create product category
      tags: [Admin Masters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_name]
              properties:
                category_name: { type: string, example: "Antibiotics" }
      responses:
        '201':
          description: Category created.

  /admin/categories/{ref}:
    parameters:
      - { name: ref, in: path, required: true, schema: { type: string } }
    get:
      summary: Get product category
      tags: [Admin Masters]
      responses: { '200': { description: Category detail. } }
    patch:
      summary: Update product category
      tags: [Admin Masters]
      responses: { '200': { description: Category updated. } }

  /admin/categories/{ref}/status:
    post:
      summary: Activate or deactivate product category
