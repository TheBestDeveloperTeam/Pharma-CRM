  # ============================================================================
  # TASK-001 — Roles, Permissions & Scope
  # ============================================================================
  /admin/roles:
    get:
      summary: List normalized roles in the current tenant
      tags: [Admin Users]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Roles returned with assigned user counts. }
    post:
      summary: Create a configurable role
      tags: [Admin Users]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleMutation'
      responses:
        '201': { description: Role created. }
        '403': { description: Missing permission or privilege escalation. }
        '422': { description: Validation failure. }

  /admin/roles/{ref}:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: string, example: ROL-01JABCDEF1234567 }
    get:
      summary: Get role detail, grants and scope overrides
      tags: [Admin Users]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Role detail. }
        '404': { description: Role is outside the caller tenant or does not exist. }
    patch:
      summary: Update a configurable role
      tags: [Admin Users]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleMutation' }
      responses:
        '200': { description: Role updated. }
        '403': { description: System/own role or unauthorized grant. }
        '422': { description: Validation failure. }
    delete:
      summary: Delete an unused configurable role
      tags: [Admin Users]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Role deleted. }
        '409': { description: Role still has assigned users. }

  /admin/roles/{ref}/clone:
    post:
      summary: Clone a role within the current franchise
      tags: [Admin Users]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { name: { type: string } }
      responses:
        '201': { description: Role cloned. }

  /admin/permissions:
    get:
      summary: Get the server-owned permission catalogue
      tags: [Admin Users]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Module/action catalogue with sensitive flags. }

  /admin/users/{ref}/roles:
    post:
      summary: Assign a normalized role to a user
      tags: [Admin Users]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_ref]
              properties: { role_ref: { type: string } }
      responses:
        '200': { description: Role assigned. }
        '403': { description: Unauthorized assignment or privilege escalation. }

  /admin/users/{ref}/roles/{role_ref}:
    delete:
      summary: Revoke a normalized role from a user
      tags: [Admin Users]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string }
        - name: role_ref
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Role revoked. }
        '403': { description: Last privileged user protection or missing permission. }
