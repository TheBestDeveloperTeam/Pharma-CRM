</head>

    </ul>

    <!-- Right navbar links -->

          <i class="fas fa-sign-out-alt"></i> Logout
        </a>
      </li>
    </ul>
  </nav>
  <!-- /.navbar -->

  <!-- Main Sidebar Container -->
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <!-- Brand Logo -->
    <a href="/dashboard.html" class="brand-link">
      <span class="brand-text font-weight-light ml-3"><b>Pharma</b>CRM</span>
    </a>

    <!-- Sidebar -->
    <div class="sidebar">
      <!-- Sidebar user panel -->
      <div class="user-panel mt-3 pb-3 mb-3 d-flex">
        <div class="info">
          <a href="#" class="d-block" id="sidebar-user-name">User Name</a>
        </div>
      </div>

      <!-- Sidebar Menu -->
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
          <li class="nav-item">
            <a href="/dashboard.html" class="nav-link">
              <i class="nav-icon fas fa-tachometer-alt"></i>
              <p>Dashboard</p>
            </a>
          </li>
          
          <li class="nav-header">MASTERS</li>
          <li class="nav-item">
            <a href="/territories.html" class="nav-link active">
              <i class="nav-icon fas fa-map-marker-alt"></i>

            </a>
          </li>
          <li class="nav-item">

              <i class="nav-icon fas fa-pills"></i>

          </li>
          <li class="nav-item">
            <a href="/customers.html" class="nav-link">
              <i class="nav-icon fas fa-user-md"></i>

            </a>
          </li>

          <li class="nav-item">

              <i class="nav-icon fas fa-calendar-check"></i>
              <p>DCRs</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="/orders.html" class="nav-link">
              <i class="nav-icon fas fa-shopping-cart"></i>
              <p>Orders</p>
            </a>
          </li>
          <li class="nav-item">

              <i class="nav-icon fas fa-boxes"></i>

          </li>
        </ul>
      </nav>
      <!-- /.sidebar-menu -->

    <!-- /.sidebar -->

  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1 class="m-0">Territories</h1>
          </div>
          <div class="col-sm-6 text-right">
            <button class="btn btn-primary" data-toggle="modal" data-target="#modal-territory">Add Territory</button>
          </div>
        </div>
      </div>
    </div>
    <!-- /.content-header -->

    <!-- Main content -->
    <div class="content">
      <div class="container-fluid">
        <div class="card">
          <div class="card-body p-0">
            <table class="table table-striped" id="territories-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Type</th>
                  <th>Status</th>
                  <th>Created At</th>
                </tr>
              </thead>
              <tbody>
                <!-- Rows will be injected here -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Add Territory Modal -->
  <div class="modal fade" id="modal-territory">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="form-territory">
          <div class="modal-header">
            <h4 class="modal-title">Add Territory</h4>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <div id="modal-error" class="alert alert-danger" style="display:none;"></div>
            <div class="form-group">
              <label>Name</label>
              <input type="text" id="t-name" class="form-control" required>
            </div>
            <div class="form-group">
              <label>Type</label>
              <select id="t-type" class="form-control">
                <option value="hq">HQ</option>
                <option value="zone">Zone</option>
                <option value="region">Region</option>
                <option value="territory">Territory</option>
              </select>
            </div>
          </div>
          <div class="modal-footer justify-content-between">
            <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-primary" id="btn-save">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Main Footer -->
  <footer class="main-footer">
    <strong>Copyright &copy; 2026 <a href="#">Pharma CRM</a>.</strong> All rights reserved.
  </footer>

<!-- REQUIRED SCRIPTS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>

<script src="/assets/js/api.js"></script>
<script>
  $(document).ready(async function() {
      if (!apiClient.checkAuth()) return;
      
      const user = apiClient.getUser();
      if (user) $('#sidebar-user-name').text(user.name || user.email);
      
      $('#btn-logout').click(function(e) {
          e.preventDefault();
          apiClient.logout();
      });

      async function loadTerritories() {
          const tbody = $('#territories-table tbody');
          tbody.html('<tr><td colspan="5" class="text-center">Loading...</td></tr>');
          
          try {
              const res = await apiClient.request('/territories');
              const data = res.data || [];
              tbody.empty();
              
              if (data.length === 0) {
                  tbody.html('<tr><td colspan="5" class="text-center">No territories found</td></tr>');
                  return;
              }
              
              data.forEach(t => {
                  tbody.append(`
                      <tr>
                          <td>${t.id}</td>
                          <td>${t.name}</td>
                          <td><span class="badge badge-info">${t.type}</span></td>
                          <td>${t.status === 'active' ? '<span class="badge badge-success">Active</span>' : '<span class="badge badge-danger">Inactive</span>'}</td>
                          <td>${new Date(t.created_at).toLocaleDateString()}</td>
                      </tr>
                  `);
              });
          } catch (err) {
              tbody.html('<tr><td colspan="5" class="text-center text-danger">Failed to load data</td></tr>');
          }
      }

      $('#form-territory').submit(async function(e) {
          e.preventDefault();
          const $btn = $('#btn-save');
          const $err = $('#modal-error');
          
          $btn.prop('disabled', true);
          $err.hide();
          
          try {
              await apiClient.request('/territories', {
                  method: 'POST',
                  body: {
                      name: $('#t-name').val(),
                      type: $('#t-type').val()
                  }
              });
              
              $('#modal-territory').modal('hide');
              $('#form-territory')[0].reset();
              loadTerritories();
          } catch (err) {
              $err.text(err.error?.message || 'Failed to create territory').show();
          } finally {
              $btn.prop('disabled', false);
          }
      });

      // Initial load
      loadTerritories();
  });
</script>
</body>
</html>
