openapi: 3.0.0
info:
  title: Pharma CRM Sales API
  version: 1.0.0
  description: Sales Force Automation API (Orders)
paths:
  /api/v1/orders:
    get:
      summary: List all orders
      responses:
        '200':
          description: A list of orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        ref:
                          type: string
                          example: ORD-2023-001
                        total_amount:
                          type: number
                          example: 1540.50
    post:
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - party_id
                - items
              properties:
                party_id:
                  type: integer
                  example: 42
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id:
                        type: integer
                      qty:
                        type: integer
      responses:
        '201':
          description: Order created
        '400':
          description: Invalid request data
