openapi: 3.0.0
info:
  title: Pharma CRM Admin API
  version: 1.0.0
  description: Administration API for managing Users, Products, and Leads
paths:
  /api/v1/users:
    get:
      summary: List all users
      responses:
        '200':
          description: A list of users
    post:
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
      responses:
        '201':
          description: User created
  /api/v1/products:
    get:
      summary: List all products
      responses:
        '200':
          description: A list of products
    post:
      summary: Create a new product
      responses:
        '201':
          description: Product created
  /api/v1/leads:
    get:
      summary: List all leads
      responses:
        '200':
          description: A list of leads
    post:
      summary: Create a new lead
      responses:
        '201':
          description: Lead created
