openapi: 3.0.0
info:
  title: Pharma CRM Auth API
  version: 1.0.0
  description: Authentication and Token Management
paths:
  /api/v1/auth/token:
    post:
      summary: Generate a new JWT Bearer Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: admin@pharma.com
                password:
                  type: string
                  example: secret123
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  token:
                    type: string
                    example: eyJ0eXAi...
                  user:
                    type: object
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid email or password
        '400':
          description: Bad request
